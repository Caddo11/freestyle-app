<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freestyle</title>
<meta name="description" content="Freestyle, le réseau social des sportifs : photos, clips, stories, stickers et discussions.">
<meta name="theme-color" content="#0F0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Freestyle">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Orbitron:wght@500;700;900&family=VT323&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
html{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one dark phone column, PS2-era console menu: CRT scanlines, cold blue glow, bevelled glossy panels. Colour pops only in stickers. */
:root{
  color-scheme:dark;
  --bg:#0F0F0F; --card:#181818; --raise:#222222; --line:#2A2A2A;
  --fg:#F4F4F2; --muted:#8F8F8B; --chalk:#FFFFFF;
  --st-yellow:#FFD23F; --st-blue:#C9CDD6; --st-pink:#FF5FA2; --st-mint:#5BE3B5; --hot:#FF4D5E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ui:"Orbitron","Eurostile","Arial Narrow",sans-serif;
  --pixel:"VT323",ui-monospace,monospace;
  --glow:#FFFFFF; --glow-soft:rgba(255,255,255,.16);
  --bevel:linear-gradient(180deg,#2a2c33 0%,#17181c 55%,#101114 100%);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--chalk);outline-offset:2px}
svg{display:block}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:94;background:radial-gradient(130% 100% at 50% 40%,transparent 60%,rgba(0,0,0,.55) 100%)}
.ps-panel{background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #050506}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:500px){.app{border-inline:1px solid var(--line)}}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex:0 0 auto;background:var(--bg);min-height:58px}
.brand{display:block}
.brand img{width:42px;height:auto;display:block}
.top{position:relative}
.spacer{width:40px;height:40px}
.top h1{font-family:var(--ui);font-weight:700;font-size:19px;margin:0;letter-spacing:.14em;text-transform:uppercase;flex:1;text-shadow:0 0 10px var(--glow-soft)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;flex:0 0 auto}
.icon-btn:hover{background:var(--raise)}
.dot{position:absolute;top:5px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--hot);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
nav.tabs .dot{top:8px;right:auto;left:calc(50% + 4px);min-width:15px;height:15px;padding:0 4px;border-radius:5px;font-family:var(--pixel);font-size:13px;font-weight:400;line-height:1;background:linear-gradient(180deg,#ff7a86 0%,#e8243a 50%,#c4142a 51%,#e0283c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1.5px #0F0F0F;z-index:2}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main.no-nav,main.clips-mode{padding-bottom:0}
main.clips-mode{overflow:hidden;background:#000}

/* Bottom nav: floating capsule */
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .pill{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:58px;border-radius:14px;background:#0F0F0F;border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #050506,0 12px 28px rgba(0,0,0,.7)}
nav.tabs button{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--ui);font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,241,236,.5)}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:#F2F1EC}
nav.tabs button[aria-current="page"] svg{stroke-width:2.5}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:1px;background:#F2F1EC}
nav.tabs .plus{width:42px;height:32px;border-radius:9px;color:#0F0F0F;display:grid;place-items:center;background:linear-gradient(180deg,#FAF9F5 0%,#ECEAE4 50%,#D6D4CD 51%,#E6E4DE 100%);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.5)}
nav.tabs .plus svg{width:18px;height:18px}

/* Feed switch */
.switch{display:flex;gap:6px;padding-block:2px 10px}
.switch button{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.switch button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--chalk)}

/* Stories as vertical tiles */
.stories{display:flex;gap:10px;overflow-x:auto;padding-block:4px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:78px;height:112px;border-radius:13px;position:relative;overflow:hidden;text-align:left;border:2.5px solid transparent;background:linear-gradient(#0F0F0F,#0F0F0F) padding-box,linear-gradient(45deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%) border-box}
.tile.seen{background:linear-gradient(#0F0F0F,#0F0F0F) padding-box,linear-gradient(#3a3a3a,#3a3a3a) border-box}
.tile.mine{border:2px dashed #3a3a3a;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.tile .grad{border-radius:10px}
.tile .grad-word{font-size:22px;left:7px;bottom:22px;right:7px;opacity:.5}
.tile .t-av{position:absolute;left:6px;top:6px;z-index:2}
.tile .t-n{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--pixel);font-size:14px;z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tile.mine .plus-big{width:34px;height:34px;border-radius:11px;background:var(--chalk);color:#0F0F0F;display:grid;place-items:center;font-size:22px;font-weight:800;margin:0 auto 6px}
.tile.mine small{display:block;font-size:10.5px;font-weight:800;text-align:center;color:var(--fg)}
.av{border-radius:30%;display:grid;place-items:center;font-family:var(--display);font-weight:900;text-transform:uppercase;flex:0 0 auto;color:#0F0F0F}

/* Sport filter */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:8px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);border-color:#e8e8e6;color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 12px var(--glow-soft)}

/* Cards */
.card{margin:0 0 18px}
.card-media{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;border:1px solid #2f323a;box-shadow:0 0 0 1px #050506,0 10px 30px rgba(0,0,0,.5);overflow:hidden;background:#000;user-select:none}
.card-media.clip{aspect-ratio:9/12}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;display:block}
.overlay-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:12px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3}
.overlay-top .who{flex:1;min-width:0;text-align:left;color:#fff}
.overlay-top b{display:block;font-size:14px;line-height:1.15}
.overlay-top small{font-size:11.5px;opacity:.8}
.ghost{font-size:12.5px;font-weight:800;color:#fff;border:1.5px solid rgba(255,255,255,.8);border-radius:10px;padding:5px 10px}
.dur{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.75);color:#fff;font-family:var(--pixel);font-size:16px;padding:1px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(15,15,15,.55);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;z-index:3}
.grad{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,var(--a),var(--b) 70%);overflow:hidden}
.grad::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%)}
.grad-word{position:absolute;left:16px;right:16px;bottom:14px;font-family:var(--display);font-weight:900;font-size:clamp(48px,15vw,76px);line-height:.85;color:rgba(255,255,255,.18);text-transform:uppercase;word-break:break-word}
.grad-cap{position:absolute;left:18px;right:18px;top:40%;color:#fff;font-weight:800;font-size:22px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,.35);z-index:2}

/* Stickers */
.stk{position:absolute;z-index:4;font-family:var(--display);font-weight:900;font-size:calc(clamp(17px,4.6vw,22px) * var(--sz,1));letter-spacing:.04em;text-transform:uppercase;padding:5px 11px 4px;border-radius:7px;line-height:1;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(var(--r,0deg));pointer-events:none}
.stk.yellow{background:var(--st-yellow);color:#111}
.stk.blue{background:linear-gradient(180deg,#f2f3f6,#b9bec8);color:#111}
.stk.pink{background:var(--st-pink);color:#111}
.stk.mint{background:var(--st-mint);color:#111}
.stk.white{background:#fff;color:#111}
.stk.outline{background:rgba(0,0,0,.35);color:#fff;border:2px solid #fff;box-shadow:none}
.stk.perf{font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:0;text-transform:none;padding:6px 9px;border-radius:5px}
.stamp{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%) scale(0);pointer-events:none;opacity:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.stamp.go{animation:stamp .8s ease forwards}
@keyframes stamp{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}50%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.cbub{position:absolute;left:12px;bottom:14px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:74%;pointer-events:none}
.clipv .cbub{bottom:auto;top:30%}
.cb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%;transform:rotate(var(--rot));animation:slap .4s cubic-bezier(.2,1.5,.4,1) both}
.cb:nth-child(2){margin-left:22px}
.cb .stk{position:static;transform:none;pointer-events:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cb-by{font-family:var(--pixel);font-size:14px;color:#fff;background:rgba(0,0,0,.55);padding:0 6px;border-radius:3px;margin-left:4px}
.cb.new .stk{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 2px #fff}
.cb.out{animation:peel .5s ease-in forwards}
@keyframes slap{from{opacity:0;transform:rotate(var(--rot)) scale(1.5)}to{opacity:1;transform:rotate(var(--rot)) scale(1)}}
@keyframes peel{to{opacity:0;transform:rotate(calc(var(--rot) + 14deg)) translate(-30px,-12px) scale(.9)}}
@keyframes holo{to{background-position:250% 0}}
@keyframes glitter{25%{background-position:3px 2px,-2px 3px,4px -1px,1px 1px,-3px 2px,0 0}50%{background-position:-2px 4px,3px -2px,-1px 3px,2px -2px,2px -1px,0 0}75%{background-position:1px -3px,-1px 1px,2px 2px,-2px 3px,1px 3px,0 0}}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-150% 0}}
.inline-cmt{display:flex;gap:8px;margin-top:10px}
.inline-cmt input{flex:1;min-width:0;background:var(--card);border:1px solid #2f323a;border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;font-size:13.5px}
.inline-cmt button{padding:0 12px;border-radius:10px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

.bar-actions{display:flex;align-items:center;gap:8px;padding-top:10px}
.respect{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);font-family:var(--pixel);font-size:19px}
.respect.on{color:var(--hot)}
.respect.on svg{fill:var(--hot)}
.round{width:38px;height:38px;border-radius:9px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);display:grid;place-items:center}
.bar-actions .sp{flex:1}
.count{font-family:var(--pixel);font-size:17px;color:var(--muted)}
.caption{margin-top:8px;font-size:14px}
.caption b{margin-right:6px}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.linkish{color:var(--muted);font-size:13px;margin-top:4px;display:inline-block}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

/* Clips */
.clips{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.clips::-webkit-scrollbar{display:none}
.clipv{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff;overflow:hidden;background:#000}
.clipv .card-media{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.clipv .scan{position:absolute;left:0;right:0;height:35%;background:linear-gradient(transparent,rgba(255,255,255,.06),transparent);animation:scan 3.2s linear infinite}
@keyframes scan{from{top:-35%}to{top:100%}}
.shade{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;z-index:3}
.clip-info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:80px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.clip-info .row{display:flex;align-items:center;gap:10px}
.rail{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#fff}
.rail .sq{width:48px;height:48px;border-radius:15px;background:rgba(20,20,20,.55);backdrop-filter:blur(6px);display:grid;place-items:center}
.rail .on .sq{color:var(--hot)}
.rail .on .sq svg{fill:var(--hot)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:#fff;z-index:6;animation:bar 9s linear infinite}
@keyframes bar{from{width:0}to{width:100%}}

/* Messages */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:11px 13px;margin-block:4px 10px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--fg);outline:none;min-width:0}
.conv{display:flex;align-items:center;gap:12px;width:100%;padding-block:9px;text-align:left}
.conv .meta{flex:1;min-width:0}
.conv .meta b{display:block}
.conv .meta span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.unread .meta span{color:var(--fg);font-weight:700}
.conv.unread::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--hot)}
.conv time{font-size:16px;color:var(--muted);font-family:var(--pixel)}
.label{font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9a9a96;margin:16px 0 4px;text-shadow:0 0 8px var(--glow-soft)}
.chat{display:flex;flex-direction:column;height:100%}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-top:6px;border-radius:12px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.room .meta{flex:1;min-width:0}
.room .meta b{display:block;font-family:var(--ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.room .meta span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-ic{width:48px;height:48px;border-radius:30%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;flex:0 0 auto}
.room-ic.sm{width:36px;height:36px}
.live{font-family:var(--pixel);font-size:15px;color:#fff;display:flex;align-items:center;gap:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.gm{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.gm.me{align-self:flex-end;justify-content:flex-end}
.gm .msg{max-width:100%}
.gh{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-block:14px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--raise);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--chalk);color:#0F0F0F;border-radius:16px 16px 4px 16px}
.msg small{display:block;font-size:10px;opacity:.55;margin-top:2px;font-family:var(--mono)}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.composer{display:flex;flex-direction:column;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(40,40,42,.55),rgba(15,15,15,.75));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.composer .line{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font:inherit;color:var(--fg)}
.send{width:44px;height:44px;border-radius:14px;background:var(--chalk);color:#0F0F0F;display:grid;place-items:center;flex:0 0 auto}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:0 0 auto;border-radius:11px;padding:6px 11px;font-size:12.5px;font-weight:700;background:var(--card)}

/* Profile */
.banner{position:relative;display:block;height:132px;max-width:100%;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%,rgba(15,15,15,.6))}
.banner.edit{height:120px;border-radius:12px;border:1px solid #2f323a;cursor:pointer}
.banner.edit .pick-file{z-index:2}
.banner-add{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--pixel);font-size:16px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 10px}
.prof-av{margin-top:-46px;position:relative;z-index:2;border-radius:30%;padding:4px;background:linear-gradient(180deg,#ffffff,#b3b6bd);box-shadow:0 6px 16px rgba(0,0,0,.5)}

.pr-edit{display:flex;flex-direction:column;gap:12px}

.prof{padding-block:0 18px}

.stats span{font-size:11.5px;color:var(--muted)}
.prof h2{margin:14px 0 2px;font-size:17px}
.prof p{margin:0;font-size:14px;color:#d6d6d2}
.prs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.prs .stk{position:static;transform:rotate(var(--r,0deg));pointer-events:auto;display:inline-block}
.prof-btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:11px 12px;border-radius:9px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);text-align:center}
.btn.primary{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);border-color:#e8e8e6;color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 12px var(--glow-soft)}

.grid button{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000;border-radius:10px}

.grid img,.grid video{width:100%;height:100%;object-fit:cover}
.grid .kind{position:absolute;right:6px;top:6px;z-index:2}

/* Create */
.form{display:flex;flex-direction:column;gap:16px;padding-block:6px 24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#0a0a0a;border:1px solid #2f323a;border-radius:10px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.seg button{padding:9px 0 7px;border-radius:7px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-family:var(--pixel);font-size:13px;letter-spacing:.02em;text-transform:none;opacity:.75}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.preview{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid #2f323a}
.preview.clip{aspect-ratio:9/12}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.preview .stk{pointer-events:auto;cursor:grab;touch-action:none}
.preview .stk:active{cursor:grabbing}
.pick-file{position:absolute;right:12px;bottom:12px;z-index:5;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:8px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.count-badge{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(0,0,0,.7);color:#fff;font-family:var(--pixel);font-size:17px;padding:1px 8px;border-radius:4px}
.pick-file input{position:absolute;width:1px;height:1px;opacity:0}
.stk-tray{display:flex;flex-wrap:wrap;gap:8px}
.stk-tray .stk{position:static;transform:rotate(var(--r,0deg));pointer-events:auto;cursor:pointer}
.stk-tray .stk[aria-pressed="true"]{outline:2px solid var(--chalk);outline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9a9a96}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:13px;padding:12px;font:inherit;width:100%}
.field textarea{resize:vertical;min-height:80px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.publish{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:8px;text-align:left;color:#0F0F0F;
 background:linear-gradient(180deg,#ffffff 0%,#e6e7ea 48%,#b4b8c0 52%,#d5d8de 100%);border:1px solid #6d7079;
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px #0a0a0a,0 0 0 4px #3a3d45,0 10px 24px rgba(0,0,0,.5)}
.publish:active{transform:translateY(1px);background:linear-gradient(180deg,#d5d8de,#b4b8c0 50%,#e6e7ea)}
.publish .ps-x{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#555,#0F0F0F 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.4)}
.publish .ps-t{display:flex;flex-direction:column;line-height:1.05}
.publish .ps-t b{font-family:var(--ui);font-weight:900;font-size:17px;letter-spacing:.22em}
.publish .ps-t small{font-family:var(--pixel);font-size:15px;color:#4a4c52}
.publish .ps-arrow{margin-left:auto;font-family:var(--pixel);font-size:22px;color:#4a4c52}
.opt{font-family:var(--pixel);font-size:14px;color:var(--muted);letter-spacing:.02em;text-transform:none;margin-left:6px}
.custom{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:10px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.custom-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.custom-head b{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.c-prev{min-height:64px;display:grid;place-items:center;background:#0a0a0a;border-radius:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);overflow:hidden;padding:8px}
.c-prev .stk{position:static;transform:rotate(-3deg)}
.c-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.c-row>span{font-family:var(--pixel);font-size:16px;color:var(--muted);width:64px;flex:0 0 auto}
.sw{width:28px;height:28px;border-radius:7px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{border-color:#fff}
.c-opt{padding:5px 10px;border-radius:7px;background:#0a0a0a;border:1px solid #2f323a;font-size:13px}
.c-opt[aria-pressed="true"]{background:#F2F1EC;color:#0F0F0F;border-color:#F2F1EC}
.c-row input[type=range]{flex:1;min-width:120px;accent-color:#F2F1EC}
.c-add{padding:10px;border-radius:8px;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides>*{flex:0 0 100%;height:100%;scroll-snap-align:center;object-fit:cover}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;z-index:4}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.stk.black{background:#0F0F0F;color:#fff}
.stk.grey{background:#8a8a8a;color:#0F0F0F}
.stk.red{background:#FF4D5E;color:#fff}
.stk.holo{color:#141414;background:linear-gradient(115deg,#e9ecf2 0%,#c8f1ff 18%,#f3d2ff 34%,#fff6c4 50%,#c9ffe6 66%,#d4dcff 82%,#eef0f5 100%);background-size:250% 100%;animation:holo 3.5s linear infinite}

/* Overlays */
.layer{position:fixed;inset:0;z-index:50;display:flex;justify-content:center}
.sv{position:relative;width:100%;max-width:480px;height:100%;background:#000;color:#fff;overflow:hidden}
.sv .card-media{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.sv-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px;z-index:7}
.sv-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bars span i{display:block;height:100%;width:0;background:#fff}
.sv-bars span.done i{width:100%}
.sv-bars span.run i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.sv-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:12px;right:8px;display:flex;align-items:center;gap:10px;z-index:7}
.sv-head b{flex:1;font-size:14px}
.sv-tap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr;z-index:5}
.sv-reply{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:7}
.sv-reply input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.7);border-radius:14px;padding:11px 14px;color:#fff;font:inherit}
.sv-reply input::placeholder{color:rgba(255,255,255,.75)}
.sheet-wrap{background:rgba(0,0,0,.6);align-items:flex-end}
.sheet{width:100%;max-width:480px;max-height:72%;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet-head{text-align:center;font-family:var(--ui);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:14px;padding:16px 12px 10px;position:relative}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-list{overflow-y:auto;padding-block:4px;flex:1}
.cmt{display:flex;gap:10px;padding-block:8px;font-size:14px}
.cmt b{margin-right:6px}
.sheet .composer{background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(180deg,rgba(64,64,68,.97),rgba(18,18,20,.97));border:1px solid #8a8a8a;box-shadow:0 0 18px var(--glow-soft),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;padding:8px 16px;border-radius:6px;font-family:var(--pixel);font-size:20px;z-index:80;max-width:calc(100% - 32px)}
.boot{position:fixed;inset:0;z-index:99;background:#0F0F0F;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease}
.boot.out{opacity:0;pointer-events:none}
.boot-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.boot .logo-wrap{position:relative;width:120px;opacity:0;animation:bootlogo 1s ease .1s forwards}
.boot img{width:120px;display:block}
.boot .shine{position:absolute;inset:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 62%,transparent 70%),linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);background-size:250% 100%,100% 100%;background-position:150% 0,0 0;animation:sweep 1.4s ease-in-out .5s infinite}
@keyframes sweep{to{background-position:-100% 0,0 0}}
.boot .logo-wrap{filter:drop-shadow(0 0 0 transparent)}
@keyframes bootlogo{0%{opacity:0;transform:scale(.85)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.boot .load{width:140px;height:4px;border-radius:2px;background:#262626;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.6)}
.boot .load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ea3ad,#fff);animation:load 1.5s ease-in-out .3s forwards}
@keyframes load{to{width:100%}}
.warn-wrap{background:rgba(0,0,0,.7);align-items:center;padding:16px;z-index:90}
.warn{width:100%;max-width:380px;border-radius:12px;padding:18px;background:var(--bevel);border:1px solid #4a4c52;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 0 3px #0a0a0a,0 20px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:12px}
.warn-head{display:flex;align-items:center;gap:10px}
.warn-head b{font-family:var(--ui);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.warn-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0F0F0F;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad)}
.warn.danger .warn-ic{color:#fff;background:linear-gradient(180deg,#ff7a86 0%,#e8243a 50%,#c4142a 51%,#e0283c 100%)}
.warn p{margin:0;font-size:14px;color:#d6d6d2}
.rules{font-family:var(--pixel);font-size:15px;color:var(--muted);text-align:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#0a0a0a}
.menu-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:1px}
.sheet-act{display:block;width:100%;text-align:left;padding:14px 4px;font-weight:700;border-bottom:1px solid var(--line)}
.sheet-act.danger{color:var(--hot)}
.ulist .conv{padding-block:8px}
.ulist .mini{padding:7px 12px;border-radius:8px;font-family:var(--ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F}
.ulist .mini.on{background:var(--raise);color:var(--fg)}
.stats button{color:inherit}
.onb{display:flex;flex-direction:column;gap:16px;padding-block:28px 40px}
.onb-logo{width:64px;align-self:center}
.onb h2{margin:0;text-align:center;font-family:var(--ui);font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.onb .sub{margin:-8px 0 0;text-align:center;color:var(--muted);font-family:var(--pixel);font-size:17px}
.handle-in{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:13px;padding-left:12px}
.handle-in span{color:var(--muted)}
.handle-in input{border:0!important;background:transparent!important;padding-left:4px!important}
.err{font-family:var(--pixel);font-size:16px;color:var(--hot);margin:0;min-height:18px}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:10px;background:#F2F1EC;color:#0F0F0F;font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.15)}
.g-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#4285F4;font-weight:900;font-family:Arial,sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--pixel);font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== Correctifs champs ===== */
.field>span.handle-in{font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg)}

/* ===== Version épurée ===== */

.rail .sq{background:rgba(20,20,20,.35)}

/* Mini menu */
.mini-menu{position:fixed;z-index:120;min-width:150px;padding:4px;border-radius:12px;background:#1b1c20;border:1px solid #33353b;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.6);display:flex;flex-direction:column}

/* Profil */
.banner{height:140px}
.banner-back{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:3;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.prof{display:flex;flex-direction:column;padding-block:0 22px}
.prof-av{align-self:flex-start;margin-top:-42px;padding:3px;border-radius:30%;background:#0F0F0F;box-shadow:none}
.prof-av .av{border:0}
.prof-id{margin-top:12px}
.prof-id h2{margin:0;font-size:19px;font-weight:800}
.prof-handle{display:block;margin-top:2px;color:var(--muted);font-size:13.5px}
.prof-bio{margin:10px 0 0;font-size:14px;color:#d6d6d2;line-height:1.5}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;padding-block:14px;border-block:1px solid var(--line)}
.pstats>*{display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit}

.pstats b{font-family:var(--ui);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

.pbtn.icon{width:40px;padding:0}

.grid{gap:3px}
.grid button{border-radius:8px}
.notif.unread-n .meta b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:var(--hot);vertical-align:middle}

/* Recadrage */

.crop-head{display:flex;align-items:center;justify-content:space-between;gap:10px}

.crop-frame{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;touch-action:none;cursor:grab;outline:2px solid rgba(255,255,255,.85);outline-offset:-2px}
.crop-frame.round{border-radius:30%}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:0 0}
.crop-zoom{width:100%;accent-color:#F2F1EC}

/* Stories : like */
.sv-likes{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px}
.sv-likes svg{width:16px;height:16px;fill:#fff}
.sv-like{width:44px;height:44px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.sv-like svg{width:26px;height:26px}
.sv-like.on{color:var(--hot)}
.sv-like.on svg{fill:var(--hot)}
.sv-like.pop-l svg{animation:popl .4s ease}
@keyframes popl{40%{transform:scale(1.35)}}
.sv-reply .send{background:none;color:#fff}

</style>

async function compressImage(file){
 try{
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const sc=Math.min(1,PHOTO.maxSide/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',PHOTO.quality));
  if(!blob||blob.size>=file.size)return file;
  return new File([blob],'photo.jpg',{type:'image/jpeg'});
 }catch(e){return file}
}
function videoDuration(file){return new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.muted=true;v.onloadedmetadata=()=>{res(v.duration||0);URL.revokeObjectURL(v.src)};v.onerror=()=>res(0);v.src=URL.createObjectURL(file)})}

 await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej});
 const dur=Math.min(v.duration||maxSec,maxSec);
 const sc=Math.min(1,VIDEO.maxSide/Math.max(v.videoWidth,v.videoHeight));
 const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc/2)*2;c.height=Math.round(v.videoHeight*sc/2)*2;
 const ctx=c.getContext('2d');const stream=c.captureStream(VIDEO.fps);
 let ac=null;
 try{ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(v);const dest=ac.createMediaStreamDestination();src.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){v.muted=true}
 const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:VIDEO.vbps,audioBitsPerSecond:VIDEO.abps});
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 const done=new Promise(r=>rec.onstop=r);
 let raf;const draw=()=>{ctx.drawImage(v,0,0,c.width,c.height);onProgress&&onProgress(Math.min(v.currentTime,dur),dur);if(v.currentTime>=dur||v.ended){stop();return}raf=requestAnimationFrame(draw)};

 try{await v.play()}catch(e){v.muted=true;try{await v.play()}catch(e2){URL.revokeObjectURL(v.src);return {file,trimmed:false,ok:false}}}
 if(ac&&ac.state==='suspended')try{await ac.resume()}catch(e){}
 rec.start(1000);draw();
 const guardT=setTimeout(stop,(dur+5)*1000);
 await done;clearTimeout(guardT);URL.revokeObjectURL(v.src);if(ac)ac.close().catch(()=>{});
 const type=mime.split(';')[0],blob=new Blob(chunks,{type});
 const trimmed=(v.duration||0)>maxSec+0.5;
 if(!blob.size||(blob.size>=file.size&&!trimmed))return {file,trimmed:false,ok:true};
 return {file:new File([blob],'clip.'+(type.includes('mp4')?'mp4':'webm'),{type}),trimmed,ok:true};
}
async function prepareFile(x,kind,onStatus){

 const max=LIMITS[kind==='story'?'story':'clip'];
 const r=await compressVideo(x.file,max,(t,d)=>onStatus(`Compression ${Math.floor(t)}/${Math.ceil(d)} s…`));
 if(!r.ok){const d=await videoDuration(x.file);if(d>max+0.5)throw new Error(`Vidéo trop longue : ${max} s maximum`);}
 if(r.trimmed)toast(`Vidéo coupée aux ${max} premières secondes`);
 return r.file;
}

function openCropper(file,aspect,outW,outH,title){
 return new Promise(resolve=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
   const d=document.createElement('div');d.className='layer crop-wrap';
   d.innerHTML=`<div class="crop"><div class="crop-head"><button type="button" class="c-opt" data-c="cancel">Annuler</button><b>${esc(title)}</b><button type="button" class="c-add" data-c="ok">Valider</button></div><div class="crop-frame ${aspect===1?'round':''}" style="aspect-ratio:${aspect}"><img alt="" draggable="false"></div><input type="range" class="crop-zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><p class="hint" style="text-align:center">Glisse pour placer · curseur pour zoomer</p></div>`;
   document.body.appendChild(d);
   const fr=d.querySelector('.crop-frame'),im=d.querySelector('img'),zr=d.querySelector('.crop-zoom');im.src=url;
   const iw=img.naturalWidth,ih=img.naturalHeight;let fw,fh,base,z=1,tx=0,ty=0;
   const layout=()=>{fw=fr.clientWidth;fh=fr.clientHeight;base=Math.max(fw/iw,fh/ih)};
   const clamp=()=>{const s=base*z;tx=Math.min(0,Math.max(fw-iw*s,tx));ty=Math.min(0,Math.max(fh-ih*s,ty))};
   const paint=()=>{clamp();const s=base*z;im.style.width=iw*s+'px';im.style.height=ih*s+'px';im.style.transform=`translate(${tx}px,${ty}px)`};
   layout();const s0=base;tx=(fw-iw*s0)/2;ty=(fh-ih*s0)/2;paint();
   const setZoom=(nz,cx=fw/2,cy=fh/2)=>{nz=Math.min(4,Math.max(1,nz));const s1=base*z,s2=base*nz;tx=cx-(cx-tx)*s2/s1;ty=cy-(cy-ty)*s2/s1;z=nz;zr.value=z;paint()};
   zr.addEventListener('input',()=>setZoom(+zr.value));
   const pts=new Map();let lastDist=0,last=null;
   fr.addEventListener('pointerdown',e=>{fr.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pts.size===2){const [a,b]=[...pts.values()];lastDist=Math.hypot(a.x-b.x,a.y-b.y)}});
   fr.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const [a,b]=[...pts.values()];const dd=Math.hypot(a.x-b.x,a.y-b.y);if(lastDist){const r=fr.getBoundingClientRect();setZoom(z*dd/lastDist,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}lastDist=dd}
    else if(last){tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};paint()}});
   const up=e=>{pts.delete(e.pointerId);lastDist=0;last=pts.size?[...pts.values()][0]:null};
   fr.addEventListener('pointerup',up);fr.addEventListener('pointercancel',up);
   fr.addEventListener('wheel',e=>{e.preventDefault();const r=fr.getBoundingClientRect();setZoom(z*(e.deltaY<0?1.08:.92),e.clientX-r.left,e.clientY-r.top)},{passive:false});
   d.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;
    if(b.dataset.c==='cancel'){d.remove();URL.revokeObjectURL(url);resolve(null);return}
    const s=base*z,cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
    cv.getContext('2d').drawImage(img,-tx/s,-ty/s,fw/s,fh/s,0,0,outW,outH);
    cv.toBlob(bl=>{d.remove();URL.revokeObjectURL(url);resolve(bl?new File([bl],'crop.jpg',{type:'image/jpeg'}):null)},'image/jpeg',.88);
   });
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Image illisible');resolve(null)};
  img.src=url;
 });
}

  <div class="field"><span>Bannière</span><label class="banner edit" style="${ban?`background:#000 url('${esc(ban)}') center/cover`:`background:radial-gradient(120% 140% at 15% 0%,${c[0]},${c[1]} 70%)`}"><span class="pick-file" style="position:absolute">Changer la bannière</span><input type="file" id="pb" accept="image/*" hidden></label></div>
  <div class="field"><span>Photo de profil</span><div class="av-edit">${avs?`<span class="av" style="width:76px;height:76px;background:#000 url('${esc(avs)}') center/cover"></span>`:av(me.id,76)}<label class="c-add" style="cursor:pointer">Choisir une photo<input type="file" id="pa" accept="image/*" hidden></label>${avs?'<button type="button" class="c-opt" data-act="rm-avatar">Retirer</button>':''}</div></div>
  <label class="field"><span>Nom affiché</span><input id="pn" maxlength="30" value="${esc(d.name)}"></label>
  <label class="field"><span>Description</span><textarea id="pd" maxlength="160" placeholder="Ton sport, ta ville, tes objectifs…">${esc(d.bio)}</textarea></label>
  <div class="field"><span>Tes 4 stickers records<em class="opt">tes perfs, tes PR, ce que tu veux</em></span>
   <div class="pr-edit">${d.prs.map((p,i)=>`<div class="pr-row"><span class="stk ${p.c}" style="--r:${[-3,2,-2,3][i]}deg" id="prp${i}">${esc(p.t)||'Sticker '+(i+1)}</span><input id="pr${i}" maxlength="22" placeholder="Ex. : Squat 140 kg" value="${esc(p.t)}" aria-label="Record ${i+1}"><div class="pr-sw">${PR_COLORS.map(([v,l])=>`<button type="button" class="sw" data-act="pr-color" data-i="${i}" data-v="${v}" aria-pressed="${p.c===v}" aria-label="${l}" style="${swatch(v)}"></button>`).join('')}</div></div>`).join('')}</div></div>
  <button class="publish" type="submit" id="pfs"><span class="ps-x">✕</span><span class="ps-t"><b>ENREGISTRER</b><small>Ton profil est mis à jour</small></span><span class="ps-arrow">▶</span></button>
 </form>`;
 const pick=(id,key)=>$(id).addEventListener('change',async e=>{const f0=e.target.files[0];if(!f0)return;keepP();const f=key==='avatar'?await openCropper(f0,1,640,640,'Photo de profil'):await openCropper(f0,3,1500,500,'Bannière');if(!f)return;d[key+'File']=f;d[key+'Prev']=URL.createObjectURL(f);renderEditProfile()});
 pick('pb','banner');pick('pa','avatar');
 $('pf').addEventListener('input',e=>{keepP();const m=e.target.id.match(/^pr(\d)$/);if(m)$('prp'+m[1]).textContent=e.target.value||'Sticker '+(+m[1]+1)});
 $('pf').addEventListener('submit',async e=>{e.preventDefault();keepP();
  if(!d.name.trim()){toast('Indique ton nom affiché');return}
  if(!(await guard([d.name,d.bio,...d.prs.map(x=>x.t)].join(' \n '))))return;
  $('pfs').disabled=true;
  try{
   if(d.avatarFile)d.avatar_url=await upload(d.avatarFile,'avatar');
   if(d.bannerFile)d.banner_url=await upload(d.bannerFile,'banner');
   const upd={name:d.name.trim(),bio:d.bio.trim(),avatar_url:d.avatar_url||null,banner_url:d.banner_url||null,prs:d.prs.map(p=>({t:p.t.trim(),c:p.c}))};
   const {data,error}=await sb.from('profiles').update(upd).eq('id',me.id).select().single();
   if(error){$('pfs').disabled=false;return dbError(error,'Enregistrement impossible')}
   me=data;P[me.id]=data;pDraft=null;toast('Profil enregistré');nav('profile',me.id);
  }catch(err){$('pfs').disabled=false}
 });
}
function keepP(){if(!pDraft||!$('pn'))return;pDraft.name=$('pn').value;pDraft.bio=$('pd').value;pDraft.prs.forEach((p,i)=>p.t=$('pr'+i).value)}

// ================= STORIES =================
let sv=null,svT;
function storyUsers(){const ids=Object.keys(storiesBy);return [...ids.filter(i=>i===me.id),...ids.filter(i=>i!==me.id)]}
function openStory(uid){const l=storyUsers();sv={list:l,ui:Math.max(0,l.indexOf(uid)),si:0};showStory()}
function showStory(){
 clearTimeout(svT);
 const uid=sv.list[sv.ui],items=storiesBy[uid]||[],it=items[sv.si];if(!it)return closeStory();
 if(!seenStories.has(it.id)){seenStories.add(it.id);sb.from('story_views').upsert({story_id:it.id,user_id:me.id},{onConflict:'story_id,user_id',ignoreDuplicates:true}).then(()=>{})}
 const left=Math.max(1,Math.ceil((new Date(it.expires_at)-Date.now())/36e5));
 layer.innerHTML=`<div class="layer" style="background:#000"><div class="sv" role="dialog" aria-label="Story de ${esc(prof(uid).handle)}">
  <div class="card-media">${mediaHTML(it.media?[it.media]:[],it.sport,'',it.media?'':it.text)}${(it.stickers||[]).map(s=>stkHTML(s)).join('')}</div>
  ${it.media&&it.text?`<div class="grad-cap" style="z-index:4">${esc(it.text)}</div>`:''}
  <div class="sv-bars">${items.map((_,i)=>`<span class="${i<sv.si?'done':i===sv.si?'run':''}"><i></i></span>`).join('')}</div>
  <div class="sv-head">${av(uid,32)}<b>${esc(prof(uid).handle)}<small style="display:block;font-family:var(--pixel);font-size:15px;font-weight:400;opacity:.8">${ago(it.created_at)} · expire dans ${left} h</small></b>${uid===me.id?`<span class="sv-likes">${I.heart}${myStoryLikes[it.id]||0}</span><button class="icon-btn" data-act="story-menu" data-id="${it.id}" aria-label="Options" style="color:#fff;font-weight:900">•••</button>`:''}<button class="icon-btn" data-act="close-story" aria-label="Fermer" style="color:#fff">${I.close}</button></div>
  <div class="sv-tap"><button data-act="sv-prev" aria-label="Précédent"></button><button data-act="sv-next" aria-label="Suivant"></button></div>
  ${uid===me.id?'':`<form class="sv-reply" id="svr"><input id="svi" placeholder="Commenter la story…" aria-label="Commenter la story" maxlength="300"><button type="button" class="sv-like ${likedStories.has(it.id)?'on':''}" data-act="story-like" data-id="${it.id}" aria-label="J’aime la story">${I.heart}</button><button class="send" type="submit" aria-label="Envoyer">${I.send}</button></form>`}
 </div></div>`;
 const f=$('svr');
 if(f){const i=$('svi');i.addEventListener('focus',()=>clearTimeout(svT));f.addEventListener('submit',async e=>{e.preventDefault();if(!i.value.trim())return;if(await sendMsg(uid,'💬 Story : '+i.value)){toast('Commentaire envoyé en message privé');closeStory()}})}
 const v=layer.querySelector('video');
 svT=setTimeout(nextStory,v?15000:5000);
}
function nextStory(){if(!sv)return;const n=(storiesBy[sv.list[sv.ui]]||[]).length;if(sv.si<n-1)sv.si++;else if(sv.ui<sv.list.length-1){sv.ui++;sv.si=0}else return closeStory();showStory()}
function prevStory(){if(sv.si>0)sv.si--;else if(sv.ui>0){sv.ui--;sv.si=0}showStory()}
function closeStory(){clearTimeout(svT);sv=null;layer.innerHTML='';if(view==='home')renderHome()}

// ================= COMMENTAIRES =================
function openComments(id){
 const list=commentsBy[id]||[],p=findPost(id),own=p&&p.user_id===me.id;
 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="Commentaires">
  <div class="sheet-head">Commentaires</div>
  <div class="sheet-list gutter">${list.length?list.map(c=>`<div class="cmt">${av(c.user_id,30)}<div style="flex:1;min-width:0"><b>${esc(prof(c.user_id).handle)}</b>${esc(c.text)} <span class="opt">${ago(c.created_at)}</span></div>${c.user_id===me.id||own?`<button class="c-opt" data-act="del-cmt" data-id="${c.id}" data-p="${id}" aria-label="Supprimer">✕</button>`:''}</div>`).join(''):'<div class="empty">Aucun commentaire. Lance la discussion.</div>'}</div>
  <form class="composer gutter" id="cf2"><div class="line"><input id="ci" maxlength="80" placeholder="Ajoute un commentaire…" aria-label="Commentaire" autocomplete="off"><button class="send" type="submit" aria-label="Envoyer">${I.send}</button></div></form>
 </div></div>`;
 $('cf2').addEventListener('submit',async e=>{e.preventDefault();const t=$('ci').value.trim();if(!t)return;if(await addComment(id,t))openComments(id)});
}

async function deletePost(id){const post=findPost(id);const {error}=await sb.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)return dbError(error,'Suppression impossible');if(post)removeFiles((post.media||[]).map(m=>m.url));feed=feed.filter(p=>p.id!==id);profilePosts=profilePosts.filter(p=>p.id!==id);toast('Publication supprimée');render()}
async function deleteStory(id){clearTimeout(svT);const sto=(storiesBy[me.id]||[]).find(x=>x.id===id);const {error}=await sb.from('stories').delete().eq('id',id).eq('user_id',me.id);if(error)return dbError(error,'Suppression impossible');if(sto&&sto.media)removeFiles([sto.media.url]);toast('Story supprimée');await loadStories();closeStory()}
// ================= ÉVÉNEMENTS =================
document.addEventListener('click',async e=>{
 const n=e.target.closest('[data-nav]');
 if(n&&me){hist=[];if(n.dataset.nav==='create'){createKind='photo'}if(n.dataset.nav==='home'){await refreshHome()}if(n.dataset.nav==='profile'){loadNotifs().then(paintBadge)}if(n.dataset.nav==='messages'){loadConvs().then(()=>{if(view==='messages')renderMessages(curQuery)})}return nav(n.dataset.nav,n.dataset.nav==='profile'?me.id:null)}
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act,u=a.dataset.u,id=a.dataset.id;
 switch(act){
  case 'auth-mode':authMode=a.dataset.m;authErr='';renderAuth();break;
  case 'pw-toggle':{const i=$('apw');i.type=i.type==='password'?'text':'password';break}
  case 'forgot':{const em=$('aem').value.trim().toLowerCase();if(!EMAIL_RE.test(em)){authErr='Écris ton e-mail ci-dessus, puis touche « Mot de passe oublié ? »';renderAuth(em);break}
   const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:BASE_URL});authErr='';authInfo=error?'Envoi impossible pour le moment, réessaie plus tard.':'Si un compte existe pour '+em+', un lien pour changer ton mot de passe a été envoyé.';renderAuth(em);break}
  case 'google':{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:BASE_URL}});if(error)warnBox('Google pas encore activé','La connexion avec Google sera disponible très bientôt. En attendant, crée ton compte avec ton e-mail.',false);break}
  case 'resend':{const {error}=await sb.auth.resend({type:'signup',email:pendingEmail,options:{emailRedirectTo:BASE_URL}});toast(error?'Patiente quelques minutes avant de renvoyer':'E-mail renvoyé');break}
  case 'to-login':authMode='login';nav('auth');break;
  case 'logout':await sb.auth.signOut();break;
  case 'settings':miniMenu(a,[{label:'Se déconnecter',danger:true,run:()=>sb.auth.signOut()}]);break;
  case 'settings-old':layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="Paramètres"><div class="sheet-head">Paramètres</div><div class="sheet-list gutter"><p class="opt" style="margin:6px 0 4px">Connecté avec ${esc(session.user.email||'')}</p><button class="sheet-act" data-act="edit-profile">Modifier le profil</button><button class="sheet-act" data-act="add-story">Ajouter une story</button><button class="sheet-act danger" data-act="logout">Se déconnecter</button><button class="sheet-act" data-act="close-sheet-btn">Annuler</button></div></div></div>`;break;
  case 'close-sheet':if(e.target===a)layer.innerHTML='';break;
  case 'close-sheet-btn':layer.innerHTML='';break;
  case 'like':toggleLike(id);break;
  case 'comments':openComments(id);break;
  case 'follow':await toggleFollow(u);if(view==='home')renderHome();else if(view==='clips')renderClips();break;
  case 'follow-prof':{await toggleFollow(u);const b=a;const on=following.has(u);b.textContent=on?'Abonné':'Suivre';b.classList.toggle('primary',!on);const el=$('st-followers');if(el){const {data}=await sb.from('profile_stats').select('followers').eq('id',u).maybeSingle();if(data)el.textContent=fmt(data.followers)}break}
  case 'follow-list':{await toggleFollow(u);const on=following.has(u);a.textContent=on?'Abonné':'Suivre';a.classList.toggle('on',on);break}
  case 'ulist':openUserList(u,a.dataset.k);break;
  case 'open-user':layer.innerHTML='';hist.push([view,arg]);nav('profile',u);break;
  case 'post-menu':miniMenu(a,[{label:'Supprimer',danger:true,run:()=>deletePost(id)}]);break;
  case 'story-menu':{clearTimeout(svT);layer.querySelectorAll('video').forEach(v=>v.pause());miniMenu(a,[{label:'Supprimer',danger:true,run:()=>deleteStory(id)}]);setTimeout(()=>{document.addEventListener('click',function resume(ev){if(!document.getElementById('mini-menu')&&sv&&layer.querySelector('.sv')){svT=setTimeout(nextStory,4000);layer.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}))}},{once:true})},0);break}
  case 'story-like':{const was=likedStories.has(id);was?likedStories.delete(id):likedStories.add(id);a.classList.toggle('on',!was);if(!was){a.classList.remove('pop-l');void a.offsetWidth;a.classList.add('pop-l')}const {error}=was?await sb.from('story_likes').delete().eq('story_id',id).eq('user_id',me.id):await sb.from('story_likes').insert({story_id:id,user_id:me.id});if(error&&!/duplicate/.test(error.message||'')){was?likedStories.add(id):likedStories.delete(id);a.classList.toggle('on',was)}break}
  case 'notifs':openNotifs();break;
  case 'sound':{e.stopPropagation();setSound(!soundOn);break}
  case 'del-ask':a.outerHTML=`<p style="margin:10px 0;color:var(--muted)">Supprimer définitivement cette publication ?</p><button class="sheet-act danger" data-act="del-yes" data-id="${id}">Oui, supprimer</button>`;break;
  case 'del-yes':{const post=findPost(id);const {error}=await sb.from('posts').delete().eq('id',id).eq('user_id',me.id);if(!error&&post)removeFiles((post.media||[]).map(m=>m.url));layer.innerHTML='';if(error)return dbError(error,'Suppression impossible');feed=feed.filter(p=>p.id!==id);profilePosts=profilePosts.filter(p=>p.id!==id);toast('Publication supprimée');render();break}
  case 'del-cmt':{const {error}=await sb.from('comments').delete().eq('id',id);if(error)return dbError(error,'Suppression impossible');commentsBy[a.dataset.p]=(commentsBy[a.dataset.p]||[]).filter(c=>c.id!==id);openComments(a.dataset.p);break}
  case 'del-story':{clearTimeout(svT);const sto=(storiesBy[me.id]||[]).find(x=>x.id===id);const {error}=await sb.from('stories').delete().eq('id',id).eq('user_id',me.id);if(!error&&sto&&sto.media)removeFiles([sto.media.url]);if(error)return dbError(error,'Suppression impossible');toast('Story supprimée');await loadStories();closeStory();break}
  case 'dm':case 'chat':layer.innerHTML='';hist.push([view,arg]);nav('chat',u);break;
  case 'profile':hist.push([view,arg]);nav('profile',u);break;
  case 'back':back();break;
  case 'global':await loadGlobal();nav('global');break;
  case 'back-msg':nav('messages');break;
  case 'story':openStory(u);break;
  case 'add-story':layer.innerHTML='';createKind='story';newDraft();nav('create');break;
  case 'new-clip':createKind='clip';newDraft();nav('create');break;
  case 'kind':createKind=a.dataset.k;if(createKind==='clip')draft.files=draft.files.filter(x=>x.type==='video').slice(0,1);if(createKind==='photo')draft.files=draft.files.filter(x=>x.type==='img');if(createKind==='story')draft.files=draft.files.slice(0,1);renderCreate();break;
  case 'stk':{const [t,c]=STICKERS[+a.dataset.i];const j=draft.stickers.findIndex(s=>s.t===t);if(j>=0)draft.stickers.splice(j,1);else if(draft.stickers.length<5)draft.stickers.push({t,c,x:+(.25+Math.random()*.5).toFixed(3),y:+(.18+Math.random()*.5).toFixed(3),r:Math.round(Math.random()*16-8)});else toast('5 stickers maximum');renderCreate();break}
  case 'toggle-custom':draft.showCustom=!draft.showCustom;renderCreate();break;
  case 'c-color':draft.custom.c=a.dataset.v;renderCreate();break;
  case 'c-font':draft.custom.f=a.dataset.v;renderCreate();break;
  case 'c-weight':draft.custom.w=+a.dataset.v;renderCreate();break;
  case 'c-add':{const cu=draft.custom;if(!cu.t.trim()){toast('Écris un texte pour ton sticker');break}if(!(await guard(cu.t,{noLinks:true})))break;if(draft.stickers.length>=5){toast('5 stickers maximum');break}draft.stickers.push({...cu,t:cu.t.trim(),x:.5,y:.4,r:Math.round(Math.random()*10-5)});cu.t='';renderCreate();toast('Sticker collé, glisse-le pour le placer');break}
  case 'edit-profile':layer.innerHTML='';pDraft=null;nav('editprofile');break;
  case 'cancel-edit':pDraft=null;nav('profile',me.id);break;
  case 'rm-avatar':keepP();pDraft.avatar_url=null;pDraft.avatarFile=null;pDraft.avatarPrev=null;renderEditProfile();break;
  case 'pr-color':keepP();pDraft.prs[+a.dataset.i].c=a.dataset.v;renderEditProfile();break;
  case 'close-story':closeStory();break;
  case 'sv-next':nextStory();break;
  case 'sv-prev':prevStory();break;
  case 'quick':{const ok=await sendMsg(arg,a.dataset.t);if(ok)document.querySelector('.quick')?.remove();break}
  case 'open-clip':hist.push([view,arg]);nav('clips',id);break;
  case 'open-item':{const p=findPost(id);if(p&&p.kind==='clip'){if(!feed.some(x=>x.id===id))feed.unshift(p);hist.push([view,arg]);nav('clips',id)}else if(p){if(!feed.some(x=>x.id===id))feed.unshift(p);hist.push([view,arg]);nav('home');setTimeout(()=>document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView(),50)}break}
 }
});
document.addEventListener('submit',async e=>{const f=e.target.closest('.inline-cmt');if(!f)return;e.preventDefault();const i=f.querySelector('input'),t=i.value;i.value='';const c=await addComment(f.dataset.id,t);if(!c)i.value=t;else{if(!f.previousElementSibling||!f.previousElementSibling.classList.contains('linkish'))f.insertAdjacentHTML('beforebegin',`<button class="linkish" data-act="comments" data-id="${f.dataset.id}">${(commentsBy[f.dataset.id]||[]).length} commentaire(s)</button>`);toast('Sticker collé')}});
document.addEventListener('scroll',e=>{const t=e.target;if(!t.classList||!t.classList.contains('slides'))return;const i=Math.round(t.scrollLeft/t.clientWidth);t.nextElementSibling?.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i))},true);
let tapT=null;document.addEventListener('click',e=>{const m=e.target.closest('[data-dbl]');if(!m||e.target.closest('button,a,input'))return;if(!m.querySelector('video'))return;clearTimeout(tapT);tapT=setTimeout(()=>setSound(!soundOn),260)});
document.addEventListener('dblclick',e=>{const m=e.target.closest('[data-dbl]');if(!m||e.target.closest('button'))return;clearTimeout(tapT);toggleLike(m.dataset.dbl,true);const s=m.querySelector('.stamp');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sv?closeStory():(layer.innerHTML='')}if(sv&&!e.target.closest('input')){if(e.key==='ArrowRight')nextStory();if(e.key==='ArrowLeft')prevStory()}});

// ================= DÉMARRAGE =================
async function refreshHome(){await Promise.all([loadFeed(),loadStories(),loadFollowing()])}
let booted=false;
async function boot(){
 const {data:{session:s}}=await sb.auth.getSession();session=s;
 if(!session){me=null;view='auth';render();return}
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(error){console.error(error);toast('Connexion au serveur impossible');}
 if(!p){me=null;view='onboard';render();return}
 me=p;P[me.id]=p;
 main.innerHTML=loadingHTML('Chargement du fil…');
 await Promise.all([refreshHome(),loadConvs(),loadGlobal(),loadNotifs()]);
 subscribeRealtime();
 cleanExpiredStories();
 if(!['home','clips','messages','profile','create'].includes(view))view='home';
 render();
}
sb.auth.onAuthStateChange((evt,s)=>{
 if(evt==='PASSWORD_RECOVERY'){session=s;view='newpw';render();return}
 if(evt==='SIGNED_IN'&&(!session||session.user.id!==s.user.id)){session=s;boot();return}
 if(evt==='SIGNED_OUT'){session=null;me=null;if(rtChannel)sb.removeChannel(rtChannel);layer.innerHTML='';authMode='login';view='auth';render();toast('Tu es déconnecté')}
});

(function splash(){
 const b=document.createElement('div');b.className='boot';b.setAttribute('role','presentation');
 b.innerHTML=`<div class="boot-in"><div class="logo-wrap" style="--m:url('${LOGO}')"><img src="${LOGO}" alt="Freestyle"><span class="shine"></span></div><div class="load"><i></i></div></div>`;
 document.body.appendChild(b);
 const start=Date.now();
 boot().catch(err=>{console.error(err);toast('Connexion au serveur impossible')}).finally(()=>{setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),650)},Math.max(0,1800-(Date.now()-start)))});
})();
})();

</script>
</body>
</html>
