<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
html{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one dark phone column, PS2-era console menu: CRT scanlines, cold blue glow, bevelled glossy panels. Colour pops only in stickers. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --card:#F5F5F5; --raise:#EFEFEF; --line:#E6E6E6;
  --fg:#0F0F0F; --muted:#737373; --chalk:#0F0F0F;
  --st-yellow:#FFD23F; --st-blue:#C9CDD6; --st-pink:#FF5FA2; --st-mint:#5BE3B5; --hot:#FF4D5E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ui:"Orbitron","Eurostile","Arial Narrow",sans-serif;
  --pixel:"VT323",ui-monospace,monospace;
  --glow:#FFFFFF; --glow-soft:rgba(255,255,255,.16);
  --bevel:linear-gradient(180deg,#fdfdfd 0%,#f4f4f4 55%,#efefef 100%);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1.5px solid rgba(242,241,236,.55);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none}
input,select,textarea{-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent}
svg{display:block}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:94;background:radial-gradient(130% 100% at 50% 40%,transparent 60%,rgba(0,0,0,.55) 100%)}
.ps-panel{background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #050506}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:500px){.app{border-inline:1px solid var(--line)}}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex:0 0 auto;background:var(--bg);min-height:58px}
.brand{display:block}
.brand img{width:42px;height:auto;display:block}
.top{position:relative}
.spacer{width:40px;height:40px}
.top h1{font-family:var(--ui);font-weight:700;font-size:19px;margin:0;letter-spacing:.14em;text-transform:uppercase;flex:1;text-shadow:0 0 10px var(--glow-soft)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;flex:0 0 auto}
.icon-btn:hover{background:var(--raise)}
.dot{position:absolute;top:5px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--hot);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
nav.tabs .dot{top:8px;right:auto;left:calc(50% + 4px);min-width:15px;height:15px;padding:0 4px;border-radius:5px;font-family:var(--pixel);font-size:13px;font-weight:400;line-height:1;background:linear-gradient(180deg,#ff7a86 0%,#e8243a 50%,#c4142a 51%,#e0283c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1.5px #0F0F0F;z-index:2}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main.no-nav,main.clips-mode{padding-bottom:0}
main.clips-mode{overflow:hidden;background:#000}

/* Bottom nav: floating capsule */
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .pill{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:58px;border-radius:14px;background:#0F0F0F;border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #050506,0 12px 28px rgba(0,0,0,.7)}
nav.tabs button{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--ui);font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,241,236,.5)}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:#F2F1EC}
nav.tabs button[aria-current="page"] svg{stroke-width:2.5}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:1px;background:#F2F1EC}
nav.tabs .plus{width:42px;height:32px;border-radius:9px;color:#0F0F0F;display:grid;place-items:center;background:linear-gradient(180deg,#FAF9F5 0%,#ECEAE4 50%,#D6D4CD 51%,#E6E4DE 100%);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.5)}
nav.tabs .plus svg{width:18px;height:18px}

/* Feed switch */
.switch{display:flex;gap:6px;padding-block:2px 10px}
.switch button{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.switch button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--chalk)}

/* Stories as vertical tiles */
.stories{display:flex;gap:10px;overflow-x:auto;padding-block:4px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:78px;height:112px;border-radius:13px;position:relative;overflow:hidden;text-align:left;border:2.5px solid transparent;background:linear-gradient(#0F0F0F,#0F0F0F) padding-box,linear-gradient(45deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%) border-box}
.tile.seen{background:linear-gradient(#0F0F0F,#0F0F0F) padding-box,linear-gradient(#3a3a3a,#3a3a3a) border-box}
.tile.mine{border:2px dashed #3a3a3a;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.tile .grad{border-radius:10px}
.tile .grad-word{font-size:22px;left:7px;bottom:22px;right:7px;opacity:.5}
.tile .t-av{position:absolute;left:6px;top:6px;z-index:2}
.tile .t-n{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--pixel);font-size:14px;z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tile.mine .plus-big{width:34px;height:34px;border-radius:11px;background:var(--chalk);color:#0F0F0F;display:grid;place-items:center;font-size:22px;font-weight:800;margin:0 auto 6px}
.tile.mine small{display:block;font-size:10.5px;font-weight:800;text-align:center;color:var(--fg)}
.av{border-radius:30%;display:grid;place-items:center;font-family:var(--display);font-weight:900;text-transform:uppercase;flex:0 0 auto;color:#0F0F0F}

/* Sport filter */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:8px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);border-color:#e8e8e6;color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 12px var(--glow-soft)}

/* Cards */
.card{margin:0 0 18px}
.card-media{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;border:1px solid #2f323a;box-shadow:0 0 0 1px #050506,0 10px 30px rgba(0,0,0,.5);overflow:hidden;background:#000;user-select:none}
.card-media.clip{aspect-ratio:9/12}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;display:block}
.overlay-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;padding:12px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3}
.overlay-top .who{flex:1;min-width:0;text-align:left;color:#fff}
.overlay-top b{display:block;font-size:14px;line-height:1.15}
.overlay-top small{font-size:11.5px;opacity:.8}
.ghost{font-size:12.5px;font-weight:800;color:#fff;border:1.5px solid rgba(255,255,255,.8);border-radius:10px;padding:5px 10px}
.dur{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.75);color:#fff;font-family:var(--pixel);font-size:16px;padding:1px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(15,15,15,.55);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;z-index:3}
.grad{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,var(--a),var(--b) 70%);overflow:hidden}
.grad::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%)}
.grad-word{position:absolute;left:16px;right:16px;bottom:14px;font-family:var(--display);font-weight:900;font-size:clamp(48px,15vw,76px);line-height:.85;color:rgba(255,255,255,.18);text-transform:uppercase;word-break:break-word}
.grad-cap{position:absolute;left:18px;right:18px;top:40%;color:#fff;font-weight:800;font-size:22px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,.35);z-index:2}

/* Stickers */
.stk{position:absolute;z-index:4;font-family:var(--display);font-weight:900;font-size:calc(clamp(17px,4.6vw,22px) * var(--sz,1));letter-spacing:.04em;text-transform:uppercase;padding:5px 11px 4px;border-radius:7px;line-height:1;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(var(--r,0deg));pointer-events:none}
.stk.yellow{background:var(--st-yellow);color:#111}
.stk.blue{background:linear-gradient(180deg,#f2f3f6,#b9bec8);color:#111}
.stk.pink{background:var(--st-pink);color:#111}
.stk.mint{background:var(--st-mint);color:#111}
.stk.white{background:#fff;color:#111}
.stk.outline{background:rgba(0,0,0,.35);color:#fff;border:2px solid #fff;box-shadow:none}
.stk.perf{font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:0;text-transform:none;padding:6px 9px;border-radius:5px}
.stamp{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%) scale(0);pointer-events:none;opacity:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.stamp.go{animation:stamp .8s ease forwards}
@keyframes stamp{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}50%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.cbub{position:absolute;left:12px;bottom:14px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:74%;pointer-events:none}
.clipv .cbub{bottom:auto;top:30%}
.cb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%;transform:rotate(var(--rot));animation:slap .4s cubic-bezier(.2,1.5,.4,1) both}
.cb:nth-child(2){margin-left:22px}
.cb .stk{position:static;transform:none;pointer-events:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cb-by{font-family:var(--pixel);font-size:14px;color:#fff;background:rgba(0,0,0,.55);padding:0 6px;border-radius:3px;margin-left:4px}
.cb.new .stk{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 2px #fff}
.cb.out{animation:peel .5s ease-in forwards}
@keyframes slap{from{opacity:0;transform:rotate(var(--rot)) scale(1.5)}to{opacity:1;transform:rotate(var(--rot)) scale(1)}}
@keyframes peel{to{opacity:0;transform:rotate(calc(var(--rot) + 14deg)) translate(-30px,-12px) scale(.9)}}
@keyframes holo{to{background-position:250% 0}}
@keyframes glitter{25%{background-position:3px 2px,-2px 3px,4px -1px,1px 1px,-3px 2px,0 0}50%{background-position:-2px 4px,3px -2px,-1px 3px,2px -2px,2px -1px,0 0}75%{background-position:1px -3px,-1px 1px,2px 2px,-2px 3px,1px 3px,0 0}}
.inline-cmt{display:flex;gap:8px;margin-top:10px}
.inline-cmt input{flex:1;min-width:0;background:var(--card);border:1px solid #2f323a;border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;font-size:13.5px}
.inline-cmt button{padding:0 12px;border-radius:10px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

.bar-actions{display:flex;align-items:center;gap:8px;padding-top:10px}
.respect{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);font-family:var(--pixel);font-size:19px}
.respect.on{color:var(--hot)}
.respect.on svg{fill:var(--hot)}
.round{width:38px;height:38px;border-radius:9px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);display:grid;place-items:center}
.bar-actions .sp{flex:1}
.count{font-family:var(--pixel);font-size:17px;color:var(--muted)}
.caption{margin-top:8px;font-size:14px}
.caption b{margin-right:6px}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.linkish{color:var(--muted);font-size:13px;margin-top:4px;display:inline-block}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

/* Clips */
.clips{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.clips::-webkit-scrollbar{display:none}
.clipv{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff;overflow:hidden;background:#000}
.clipv .card-media{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.clipv .scan{position:absolute;left:0;right:0;height:35%;background:linear-gradient(transparent,rgba(255,255,255,.06),transparent);animation:scan 3.2s linear infinite}
@keyframes scan{from{top:-35%}to{top:100%}}
.shade{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;z-index:3}
.clip-info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:80px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.clip-info .row{display:flex;align-items:center;gap:10px}
.rail{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#fff}
.rail .sq{width:48px;height:48px;border-radius:15px;background:rgba(20,20,20,.55);backdrop-filter:blur(6px);display:grid;place-items:center}
.rail .on .sq{color:var(--hot)}
.rail .on .sq svg{fill:var(--hot)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:#fff;z-index:6;animation:bar 9s linear infinite}
@keyframes bar{from{width:0}to{width:100%}}

/* Messages */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:11px 13px;margin-block:4px 10px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--fg);outline:none;min-width:0}
.conv{display:flex;align-items:center;gap:12px;width:100%;padding-block:9px;text-align:left}
.conv .meta{flex:1;min-width:0}
.conv .meta b{display:block}
.conv .meta span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.unread .meta span{color:var(--fg);font-weight:700}
.conv.unread::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--hot)}
.conv time{font-size:16px;color:var(--muted);font-family:var(--pixel)}
.label{font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9a9a96;margin:16px 0 4px;text-shadow:0 0 8px var(--glow-soft)}
.chat{display:flex;flex-direction:column;height:100%}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-top:6px;border-radius:12px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.room .meta{flex:1;min-width:0}
.room .meta b{display:block;font-family:var(--ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.room .meta span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-ic{width:48px;height:48px;border-radius:30%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;flex:0 0 auto}
.room-ic.sm{width:36px;height:36px}
.live{font-family:var(--pixel);font-size:15px;color:#fff;display:flex;align-items:center;gap:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.gm{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.gm.me{align-self:flex-end;justify-content:flex-end}
.gm .msg{max-width:100%}
.gh{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-block:14px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--raise);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--chalk);color:#0F0F0F;border-radius:16px 16px 4px 16px}
.msg small{display:block;font-size:10px;opacity:.55;margin-top:2px;font-family:var(--mono)}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.composer{display:flex;flex-direction:column;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(40,40,42,.55),rgba(15,15,15,.75));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.composer .line{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font:inherit;color:var(--fg)}
.send{width:44px;height:44px;border-radius:14px;background:var(--chalk);color:#0F0F0F;display:grid;place-items:center;flex:0 0 auto}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:0 0 auto;border-radius:11px;padding:6px 11px;font-size:12.5px;font-weight:700;background:var(--card)}

/* Profile */
.banner{position:relative;display:block;height:132px;max-width:100%;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%,rgba(15,15,15,.6))}
.banner.edit{height:120px;border-radius:12px;border:1px solid #2f323a;cursor:pointer}
.banner.edit .pick-file{z-index:2}
.banner-add{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--pixel);font-size:16px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 10px}
.prof-av{margin-top:-46px;position:relative;z-index:2;border-radius:30%;padding:4px;background:linear-gradient(180deg,#ffffff,#b3b6bd);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.prof-av .av{border:0}
.av-edit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pr-edit{display:flex;flex-direction:column;gap:12px}
.pr-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-radius:10px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.pr-row .stk{position:static;justify-self:start;transform:rotate(var(--r))}
.pr-row input{border:1px solid var(--line);background:#0a0a0a;color:var(--fg);border-radius:8px;padding:10px;font:inherit}
.pr-sw{display:flex;gap:6px;flex-wrap:wrap}
.prof{padding-block:0 18px}
.prof-top{display:flex;align-items:center;gap:16px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-family:var(--ui);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.stats span{font-size:11.5px;color:var(--muted)}
.prof h2{margin:14px 0 2px;font-size:17px}
.prof p{margin:0;font-size:14px;color:#d6d6d2}
.prs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.prs .stk{position:static;transform:rotate(var(--r,0deg));pointer-events:auto;display:inline-block}
.prof-btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:11px 12px;border-radius:9px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);text-align:center}
.btn.primary{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);border-color:#e8e8e6;color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 12px var(--glow-soft)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid button{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000;border-radius:10px}
.grid .grad-word{font-size:22px;left:8px;bottom:6px}
.grid img,.grid video{width:100%;height:100%;object-fit:cover}
.grid .kind{position:absolute;right:6px;top:6px;z-index:2}

/* Create */
.form{display:flex;flex-direction:column;gap:16px;padding-block:6px 24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#0a0a0a;border:1px solid #2f323a;border-radius:10px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.seg button{padding:9px 0 7px;border-radius:7px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-family:var(--pixel);font-size:13px;letter-spacing:.02em;text-transform:none;opacity:.75}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.preview{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid #2f323a}
.preview.clip{aspect-ratio:9/12}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.preview .stk{pointer-events:auto;cursor:grab;touch-action:none}
.preview .stk:active{cursor:grabbing}
.pick-file{position:absolute;right:12px;bottom:12px;z-index:5;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:8px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.count-badge{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(0,0,0,.7);color:#fff;font-family:var(--pixel);font-size:17px;padding:1px 8px;border-radius:4px}
.pick-file input{position:absolute;width:1px;height:1px;opacity:0}
.stk-tray{display:flex;flex-wrap:wrap;gap:8px}
.stk-tray .stk{position:static;transform:rotate(var(--r,0deg));pointer-events:auto;cursor:pointer}
.stk-tray .stk[aria-pressed="true"]{outline:2px solid var(--chalk);outline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9a9a96}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:13px;padding:12px;font:inherit;width:100%}
.field textarea{resize:vertical;min-height:80px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.publish{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:8px;text-align:left;color:#0F0F0F;
 background:linear-gradient(180deg,#ffffff 0%,#e6e7ea 48%,#b4b8c0 52%,#d5d8de 100%);border:1px solid #6d7079;
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px #0a0a0a,0 0 0 4px #3a3d45,0 10px 24px rgba(0,0,0,.5)}
.publish:active{transform:translateY(1px);background:linear-gradient(180deg,#d5d8de,#b4b8c0 50%,#e6e7ea)}
.publish .ps-x{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#555,#0F0F0F 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.4)}
.publish .ps-t{display:flex;flex-direction:column;line-height:1.05}
.publish .ps-t b{font-family:var(--ui);font-weight:900;font-size:17px;letter-spacing:.22em}
.publish .ps-t small{font-family:var(--pixel);font-size:15px;color:#4a4c52}
.publish .ps-arrow{margin-left:auto;font-family:var(--pixel);font-size:22px;color:#4a4c52}
.opt{font-family:var(--pixel);font-size:14px;color:var(--muted);letter-spacing:.02em;text-transform:none;margin-left:6px}
.custom{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:10px;background:var(--bevel);border:1px solid #2f323a;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.custom-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.custom-head b{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.c-prev{min-height:64px;display:grid;place-items:center;background:#0a0a0a;border-radius:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);overflow:hidden;padding:8px}
.c-prev .stk{position:static;transform:rotate(-3deg)}
.c-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.c-row>span{font-family:var(--pixel);font-size:16px;color:var(--muted);width:64px;flex:0 0 auto}
.sw{width:28px;height:28px;border-radius:7px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{border-color:#fff}
.c-opt{padding:5px 10px;border-radius:7px;background:#0a0a0a;border:1px solid #2f323a;font-size:13px}
.c-opt[aria-pressed="true"]{background:#F2F1EC;color:#0F0F0F;border-color:#F2F1EC}
.c-row input[type=range]{flex:1;min-width:120px;accent-color:#F2F1EC}
.c-add{padding:10px;border-radius:8px;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides>*{flex:0 0 100%;height:100%;scroll-snap-align:center;object-fit:cover}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;z-index:4}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.stk.black{background:#0F0F0F;color:#fff}
.stk.grey{background:#8a8a8a;color:#0F0F0F}
.stk.red{background:#FF4D5E;color:#fff}
.stk.holo{color:#141414;background:linear-gradient(115deg,#e9ecf2 0%,#c8f1ff 18%,#f3d2ff 34%,#fff6c4 50%,#c9ffe6 66%,#d4dcff 82%,#eef0f5 100%);background-size:250% 100%;animation:holo 3.5s linear infinite}

/* Overlays */
.layer{position:fixed;inset:0;z-index:50;display:flex;justify-content:center}
.sv{position:relative;width:100%;max-width:480px;height:100%;background:#000;color:#fff;overflow:hidden}
.sv .card-media{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.sv-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px;z-index:7}
.sv-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bars span i{display:block;height:100%;width:0;background:#fff}
.sv-bars span.done i{width:100%}
.sv-bars span.run i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.sv-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:12px;right:8px;display:flex;align-items:center;gap:10px;z-index:7}
.sv-head b{flex:1;font-size:14px}
.sv-tap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr;z-index:5}
.sv-reply{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:7}
.sv-reply input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.7);border-radius:14px;padding:11px 14px;color:#fff;font:inherit}
.sv-reply input::placeholder{color:rgba(255,255,255,.75)}
.sheet-wrap{background:rgba(0,0,0,.6);align-items:flex-end}
.sheet{width:100%;max-width:480px;max-height:72%;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet-head{text-align:center;font-family:var(--ui);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:14px;padding:16px 12px 10px;position:relative}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-list{overflow-y:auto;padding-block:4px;flex:1}
.cmt{display:flex;gap:10px;padding-block:8px;font-size:14px}
.cmt b{margin-right:6px}
.sheet .composer{background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(180deg,rgba(64,64,68,.97),rgba(18,18,20,.97));border:1px solid #8a8a8a;box-shadow:0 0 18px var(--glow-soft),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;padding:8px 16px;border-radius:6px;font-family:var(--pixel);font-size:20px;z-index:80;max-width:calc(100% - 32px)}
.boot{position:fixed;inset:0;z-index:99;background:#0F0F0F;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease}
.boot.out{opacity:0;pointer-events:none}
.boot-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.boot .logo-wrap{position:relative;width:120px;opacity:0;animation:bootlogo 1s ease .1s forwards}
.boot img{width:120px;display:block}
.boot .shine{position:absolute;inset:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 62%,transparent 70%),linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);background-size:250% 100%,100% 100%;background-position:150% 0,0 0;animation:sweep 1.4s ease-in-out .5s infinite}
@keyframes sweep{to{background-position:-100% 0,0 0}}
.boot .logo-wrap{filter:drop-shadow(0 0 0 transparent)}
@keyframes bootlogo{0%{opacity:0;transform:scale(.85)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.boot .load{width:140px;height:4px;border-radius:2px;background:#262626;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.6)}
.boot .load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ea3ad,#fff);animation:load 1.5s ease-in-out .3s forwards}
@keyframes load{to{width:100%}}
.warn-wrap{background:rgba(0,0,0,.7);align-items:center;padding:16px;z-index:90}
.warn{width:100%;max-width:380px;border-radius:12px;padding:18px;background:var(--bevel);border:1px solid #4a4c52;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 0 3px #0a0a0a,0 20px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:12px}
.warn-head{display:flex;align-items:center;gap:10px}
.warn-head b{font-family:var(--ui);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.warn-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0F0F0F;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad)}
.warn.danger .warn-ic{color:#fff;background:linear-gradient(180deg,#ff7a86 0%,#e8243a 50%,#c4142a 51%,#e0283c 100%)}
.warn p{margin:0;font-size:14px;color:#d6d6d2}
.rules{font-family:var(--pixel);font-size:15px;color:var(--muted);text-align:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#0a0a0a}
.menu-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:1px}
.sheet-act{display:block;width:100%;text-align:left;padding:14px 4px;font-weight:700;border-bottom:1px solid var(--line)}
.sheet-act.danger{color:var(--hot)}
.ulist .conv{padding-block:8px}
.ulist .mini{padding:7px 12px;border-radius:8px;font-family:var(--ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:linear-gradient(180deg,#fff,#c9ccd4 55%,#9ea3ad);color:#0F0F0F}
.ulist .mini.on{background:var(--raise);color:var(--fg)}
.stats button{color:inherit}
.onb{display:flex;flex-direction:column;gap:16px;padding-block:28px 40px}
.onb-logo{width:64px;align-self:center}
.onb h2{margin:0;text-align:center;font-family:var(--ui);font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.onb .sub{margin:-8px 0 0;text-align:center;color:var(--muted);font-family:var(--pixel);font-size:17px}
.handle-in{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:13px;padding-left:12px}
.handle-in span{color:var(--muted)}
.handle-in input{border:0!important;background:transparent!important;padding-left:4px!important}
.err{font-family:var(--pixel);font-size:16px;color:var(--hot);margin:0;min-height:18px}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:10px;background:#F2F1EC;color:#0F0F0F;font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.15)}
.g-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#4285F4;font-weight:900;font-family:Arial,sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--pixel);font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== Correctifs champs ===== */
.field>span.handle-in{font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg)}
.field>span.handle-in>span{font-family:var(--body);font-size:15px}

/* ===== Version épurée ===== */
.stories{gap:10px}
.card{margin:0 0 26px}
.card-media{border:0;box-shadow:none}
.overlay-top{padding:12px 12px 24px;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.overlay-top small{opacity:.7}
.ghost{border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:4px 10px;font-size:12px}
.menu-btn{width:32px;height:32px;opacity:.85}
.bar-actions{gap:2px;padding-top:6px;margin-left:-8px}
.respect,.round{background:none;border:0;box-shadow:none;height:40px;padding:0 8px}
.round{width:40px}
.respect{font-family:var(--body);font-size:14px;font-weight:700;gap:6px}
.respect.on{background:none;color:var(--hot)}
.caption{margin-top:2px;font-size:14px;color:#dcdcd8}
.caption b{color:var(--fg)}
.linkish{font-size:13px;margin-top:2px}
.inline-cmt{margin-top:8px;gap:6px}
.inline-cmt input{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;font-size:13.5px}
.inline-cmt input:focus{outline:none;border-bottom-color:#8a8a8a}
.inline-cmt button{background:none;box-shadow:none;color:var(--fg);padding:0 4px;font-size:10.5px;opacity:.8}
.snd{position:absolute;right:12px;bottom:12px;z-index:5;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.card-media .stk.perf{bottom:52px}
.label{color:var(--muted);text-shadow:none}
.toast{font-family:var(--body);font-size:14px;font-weight:600;border-radius:12px;padding:10px 16px}
.sheet-head{font-family:var(--body);font-weight:800;letter-spacing:0;text-transform:none;font-size:15px}
.rail .sq{background:rgba(20,20,20,.35)}

/* Mini menu */
.mini-menu{position:fixed;z-index:120;min-width:150px;padding:4px;border-radius:12px;background:#1b1c20;border:1px solid #33353b;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.6);display:flex;flex-direction:column}
.mini-menu button{padding:10px 14px;border-radius:9px;text-align:left;font-weight:700;font-size:14px}
.mini-menu button:hover{background:#26282d}
.mini-menu button.danger{color:var(--hot)}

/* Profil */
.banner{height:140px}
.banner-back{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:3;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.prof{display:flex;flex-direction:column;padding-block:0 22px}
.prof-av{align-self:flex-start;margin-top:-42px;padding:3px;border-radius:30%;background:#0F0F0F;box-shadow:none}
.prof-av .av{border:0}
.prof-id{margin-top:12px}
.prof-id h2{margin:0;font-size:19px;font-weight:800}
.prof-handle{display:block;margin-top:2px;color:var(--muted);font-size:13.5px}
.prof-bio{margin:10px 0 0;font-size:14px;color:#d6d6d2;line-height:1.5}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;padding-block:14px;border-block:1px solid var(--line)}
.pstats>*{display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit}
.pstats>*+*{border-left:1px solid var(--line)}
.pstats b{font-family:var(--ui);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pstats span{font-size:11.5px;color:var(--muted)}
.prof .prs{margin-top:16px}
.prof-actions{display:flex;gap:8px;margin-top:18px}
.pbtn{height:36px;padding:0 16px;border-radius:10px;background:var(--raise);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.pbtn.primary{background:#F2F1EC;color:#0F0F0F}
.pbtn.icon{width:40px;padding:0}
.pbtn.icon svg{width:19px;height:19px}
.bell-dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
.prof-actions .pbtn:not(.icon){flex:0 0 auto}
.grid{gap:3px}
.grid button{border-radius:8px}

.cm{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.cm-card{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cm-ic{width:56px;height:56px;border-radius:18px;background:var(--paper);border:1px solid var(--paper-line);display:grid;place-items:center;color:var(--ink);margin-bottom:20px}
.cm-title{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;color:#0F0F0F}
.cm-text{margin:10px 0 0;font-size:14px;color:#737373}
.cm-mail{margin:4px 0 0;font-size:15px;font-weight:700;color:#0F0F0F;word-break:break-all}
.cm-note{margin:16px 0 0;font-size:13px;line-height:1.5;color:#8e8e8a;max-width:290px}
.cm-primary{margin-top:26px;width:100%;height:44px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14.5px}
.cm-link{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink);padding:6px 10px}
/* Recadrage façon capture d'écran */
.crop-wrap{background:rgba(12,12,12,.94)}
.crop{max-width:none;width:auto;align-items:center}
.crop-head{width:100%;max-width:460px;color:#fff}
.crop-head b{font-size:15px;font-weight:700}
.crop-txt{color:#cfcfcf;font-size:15px;font-weight:500;padding:6px 2px}
.crop-txt.strong{color:#fff;font-weight:700}
.crop-stage{position:relative;overflow:hidden;border-radius:6px;touch-action:none;user-select:none}
.crop-stage img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.crop-box{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.58);outline:1.5px solid rgba(255,255,255,.95);cursor:move;touch-action:none}
.crop-box.sq{border-radius:22%}
.cg{position:absolute;background:rgba(255,255,255,.35);opacity:0;transition:opacity .15s}
.crop-box.drag .cg{opacity:1}
.cg1,.cg2{top:0;bottom:0;width:1px}.cg1{left:33.33%}.cg2{left:66.66%}
.cg3,.cg4{left:0;right:0;height:1px}.cg3{top:33.33%}.cg4{top:66.66%}
.ch{position:absolute;width:26px;height:26px;touch-action:none}
.ch::before{content:"";position:absolute;width:18px;height:18px;border:3px solid #fff}
.ch.tl{left:-6px;top:-6px;cursor:nwse-resize}.ch.tl::before{left:3px;top:3px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.ch.tr{right:-6px;top:-6px;cursor:nesw-resize}.ch.tr::before{right:3px;top:3px;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.ch.bl{left:-6px;bottom:-6px;cursor:nesw-resize}.ch.bl::before{left:3px;bottom:3px;border-right:0;border-top:0;border-radius:0 0 0 4px}
.ch.br{right:-6px;bottom:-6px;cursor:nwse-resize}.ch.br::before{right:3px;bottom:3px;border-left:0;border-top:0;border-radius:0 0 4px 0}
.crop-hint{color:#a8a8a8;font-size:13px;margin:0;text-align:center}
.crop-zoom{display:none}
/* Clips plein écran */
.clips-wrap{position:relative;height:100%;background:#000}
.clips-top{position:absolute;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:12px max(14px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.clips-top span{font-family:var(--body);font-weight:800;font-size:20px;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.clips-plus{pointer-events:auto;width:42px;height:42px;display:grid;place-items:center;filter:drop-shadow(0 1px 6px rgba(0,0,0,.4))}
.clip-info{font-family:var(--body);gap:6px}
.clip-info .row b{font-family:var(--body);font-size:15px;font-weight:700;color:#fff}
.clip-cap{margin:0;font-size:14px;line-height:1.4;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.clip-meta{font-size:12.5px;color:rgba(255,255,255,.75);font-weight:500}
.clip-info .ghost{font-family:var(--body);font-size:12.5px;font-weight:700}
.ps-rail{gap:18px}
.ps-rail button{font-family:var(--body);font-size:12px;font-weight:700;color:#fff;gap:3px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ps-rail .ps-ic{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.ps-rail .on .ps-f{fill:url(#chrRed)}
.ps-rail .rail-snd{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.clipv .shade{height:42%}
/* Modifier la description */
.ec{display:flex;flex-direction:column;gap:12px;padding-block:6px 18px}
.ec textarea{width:100%;border:1px solid var(--paper-line);background:var(--paper);border-radius:12px;padding:12px;font:inherit;font-size:14.5px;color:#0F0F0F;resize:none}
.ec textarea:focus{outline:none;border-color:#c9c7c0;background:#fff}
.ec-row{display:flex;align-items:center;gap:8px}
.ec-count{flex:1;font-size:12px;color:#a3a29d}
.ec-cancel{height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink)}
.ec-save{height:38px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13.5px}

.app:has(main.clips-mode) nav.tabs{background:none}
.app:has(main.clips-mode) nav.tabs .pill{background:rgba(255,255,255,.9)}

/* ================= v8 : Publier, barre, fluidité ================= */
.top h1,.top .ptitle{flex:1;text-align:center;font-family:var(--body);font-size:18px;font-weight:800;letter-spacing:-.01em;text-transform:none;text-shadow:none}
.top-side{display:flex;align-items:center;gap:2px;width:84px}
.top-side.r{justify-content:flex-end}
.top-side .icon-btn{position:relative}
/* Publier */
.pub{display:flex;flex-direction:column;gap:18px;padding-block:8px 30px}
.pub-seg{background:var(--paper);border:1px solid var(--paper-line)}
.pub-seg button{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:14px;font-weight:700;color:#8e8e8a;padding:9px 0}
.pub-seg button small{font-family:var(--body);font-size:11.5px;font-weight:500;color:#a3a29d;opacity:1}
.pub-seg button[aria-pressed="true"]{color:var(--ink)}
.pub-seg button[aria-pressed="true"] small{color:#737373}
.pub-media{display:flex;gap:10px;flex-wrap:wrap}
.pub-th{position:relative;width:88px;height:116px;border-radius:14px;overflow:hidden;background:#111;animation:popIn .35s cubic-bezier(.22,.9,.25,1) both}
.pub-th img,.pub-th video{width:100%;height:100%;object-fit:cover;display:block}
.pub-rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(20,20,20,.6);color:#fff;font-size:11px;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pub-add{width:88px;height:116px;border-radius:14px;border:1.5px dashed #cfcdc6;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);cursor:pointer;transition:background .2s,transform .2s}
.pub-add:active{transform:scale(.96)}
.pub-add b{font-size:30px;font-weight:300;line-height:1}
.pub-add small{font-size:11.5px;color:#8e8e8a}
.pub-hint{font-size:12px;color:#a3a29d;margin:-10px 0 0}
/* Barre : 5 onglets, se réduit au scroll */
nav.tabs .pill{grid-template-columns:repeat(4,1fr) 1.1fr;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.22,.9,.25,1),box-shadow .45s ease}
nav.tabs.mini .pill{transform:scale(.86);box-shadow:0 6px 18px rgba(0,0,0,.08)}
nav.tabs button svg{transition:transform .25s cubic-bezier(.22,.9,.25,1)}
nav.tabs button:active svg{transform:scale(.88)}
nav.tabs button[aria-current="page"]{transition:background .3s ease}
/* Actions sous les posts un peu décalées vers la droite */
.ps-bar{margin-left:2px}
.react-btn{margin-right:2px}
/* ===== Fluidité / transitions premium ===== */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
main>*{animation:viewIn .42s cubic-bezier(.22,.9,.25,1) both}
.card{animation:cardIn .55s cubic-bezier(.22,.9,.25,1) both}
.card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}.card:nth-of-type(4){animation-delay:.18s}
.tile{animation:popIn .45s cubic-bezier(.22,.9,.25,1) both}
.tile:nth-child(2){animation-delay:.04s}.tile:nth-child(3){animation-delay:.08s}.tile:nth-child(4){animation-delay:.12s}.tile:nth-child(5){animation-delay:.16s}
.card-media img,.card-media video,.grid img{animation:fadeIn .6s ease both}
.grid button{animation:popIn .4s cubic-bezier(.22,.9,.25,1) both}
.sheet-wrap{animation:fadeIn .25s ease both}
.sheet{animation:sheetUp .42s cubic-bezier(.22,.9,.25,1) both}
.mini-menu{animation:menuIn .2s cubic-bezier(.22,.9,.25,1) both;transform-origin:top center}
.toast{animation:toastIn .32s cubic-bezier(.22,.9,.25,1) both}
.sv{animation:popIn .3s cubic-bezier(.22,.9,.25,1) both}
.warn{animation:popIn .3s cubic-bezier(.22,.9,.25,1) both}
.conv{transition:background .2s ease}
.conv:active{background:var(--paper)}
button,.pbtn,.ep-btn,.ep-save,.auth-btn,.cm-primary{transition:transform .18s cubic-bezier(.22,.9,.25,1),background .2s ease,opacity .2s ease}
.pbtn:active,.ep-btn:active,.ep-save:active,.auth-btn:active,.cm-primary:active,.ghost:active,.tile:active,.feed-pick:active,.icon-btn:active,.ps-bar button:active,.ps-rail button:active{transform:scale(.95)}
.sv-tap button:active{transform:none}
.respect .ps-ic,.react-btn .ps-ic{transition:transform .25s cubic-bezier(.22,.9,.25,1)}
.ps-bar .respect.on .ps-ic{animation:popl .4s ease}
html{scroll-behavior:smooth}
main{scroll-behavior:auto;overscroll-behavior-y:contain}

/* v9 : photo de profil calée dans le coin de la bannière */
.pav{left:6px;bottom:6px;padding:3px;border-radius:12px}
.pav .av{border-radius:9px!important}
.ep-av{left:6px;bottom:6px;border-radius:12px}
.ep-av .av{border-radius:9px!important}
/* v10 : en-tête catégorie, partage, story rapide, admin, publier */
.feed-pick{flex:0 1 auto;justify-content:flex-start;gap:5px;font-size:16px;font-weight:600;min-width:0;white-space:nowrap}
.feed-pick .fp-l{color:#8e8e8a;font-weight:600}
.feed-pick .fp-v{font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.feed-pick svg{flex:0 0 auto;color:#8e8e8a}
.top-side.r{width:auto;gap:0}
.top-side.r .icon-btn{width:38px}
.vbadge{display:inline-block;vertical-align:-2px;margin-left:4px;flex:0 0 auto}
.ptitle .vbadge{width:17px;height:17px;vertical-align:-3px}
.send{border-radius:50%}
/* texte des flashs vidéo */
.stk.st-plain,.stk.st-pill,.stk.st-dark,.stk.st-yellow{font-family:var(--body);font-weight:800;text-transform:none;letter-spacing:0;font-size:calc(clamp(20px,7vw,32px) * var(--sz,1));padding:.18em .45em;border-radius:.35em;box-shadow:none;white-space:pre;text-align:center;line-height:1.15}
.stk.st-plain{background:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.stk.st-pill{background:#fff;color:#111}
.stk.st-dark{background:rgba(17,17,17,.86);color:#fff}
.stk.st-yellow{background:#FFD23F;color:#111}
/* éditeur de story */
.se-wrap{position:fixed;inset:0;z-index:70;background:#000;display:flex;justify-content:center;animation:viewIn .25s ease both}
.se{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
.se-stage{position:relative;flex:0 0 auto;border-radius:18px;overflow:hidden;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
.se-stage>img,.se-stage>video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.se-stage>video{object-fit:cover}
.se-items{position:absolute;inset:0}
.se-it{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;outline:0 dashed rgba(255,255,255,.9);outline-offset:6px;transition:outline-width .15s}
.se-it.sel{outline-width:1.5px}
.se-it.t{font-family:var(--body);font-weight:800;white-space:pre;text-align:center;line-height:1.15;padding:.18em .45em;border-radius:.35em}
.st-plain{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.st-pill{background:#fff;color:#111}
.st-dark{background:rgba(17,17,17,.86);color:#fff}
.st-yellow{background:#FFD23F;color:#111}
.se-it.im img{display:block;width:100%;border-radius:6%;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.se-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(rgba(0,0,0,.35),transparent);z-index:3}
.se-top .sp{flex:1}
.se-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.se-ic b{font-family:var(--body);font-size:17px;font-weight:800}
.se-ic svg{width:22px;height:22px}
.se-tools{position:absolute;left:0;right:0;margin-inline:auto;bottom:14px;width:max-content;max-width:calc(100% - 16px);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:3;animation:popIn .2s ease both}
.se-tools[hidden]{display:none}
.se-tools button{color:#fff;font-size:13px;font-weight:700;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.12)}
.se-tools button.danger{color:#ff8a95}
.se-bottom{width:100%;display:flex;align-items:center;gap:12px;padding:0 14px}
.se-hint{flex:1;color:rgba(255,255,255,.65);font-size:12.5px;line-height:1.35}
.se-hint[hidden]{display:block;visibility:hidden}
.se-share{flex:0 0 auto;margin-left:auto;background:#fff;color:#111;font-weight:800;font-size:15px;padding:12px 26px;border-radius:999px}
.se-share:disabled{opacity:.7}
.se-txt{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;gap:18px;animation:fadeIn .2s ease both}
.se-txt-top{display:flex;width:100%;max-width:480px}
.se-txt-top .sp{flex:1}
.se-ok{color:#fff;font-weight:800;font-size:16px;padding:8px 14px}
.se-txt textarea{width:100%;max-width:420px;margin-top:12vh;background:transparent;border:0;outline:0;resize:none;font-family:var(--body);font-weight:800;font-size:30px;text-align:center;line-height:1.15;border-radius:.35em;padding:.2em .4em}
.se-txt textarea::placeholder{color:rgba(255,255,255,.55);text-shadow:none}
.se-txt textarea.st-pill::placeholder,.se-txt textarea.st-yellow::placeholder{color:rgba(0,0,0,.4)}
.se-st{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.se-st button{font-family:var(--body);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;border:1.5px solid transparent}
.se-st button.st-plain{background:rgba(255,255,255,.12)}
.se-st button.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
/* publier : grand cadre + plus transparent au centre */
.pub-stage{position:relative;width:100%;aspect-ratio:4/5;max-height:62vh;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#ecebe6,#d9d8d2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:popIn .35s cubic-bezier(.22,.9,.25,1) both}
.pub-stage.clip{aspect-ratio:9/16;height:min(58vh,540px);max-height:none;width:auto;margin-inline:auto}
.pub-stage>img,.pub-stage>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pub-stage.has::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.18),transparent 60%);pointer-events:none}
.pub-plus{position:relative;z-index:2;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 30px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);transition:transform .2s,background .2s}
.pub-plus:active{transform:scale(.92)}
.pub-stage.has .pub-plus{color:#fff;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.pub-plus-l{position:relative;z-index:2;font-size:13px;font-weight:600;color:#6f6e69}
.pub-stage.has .pub-plus-l{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.pub-strip{display:flex;gap:8px;align-items:center;overflow-x:auto;margin-top:-6px}
.pub-strip .pub-th{width:58px;height:74px;border-radius:11px;flex:0 0 auto}
.pub-strip .pub-hint{margin:0 0 0 4px;font-size:12px;color:#a3a29d}
.se-txt textarea.st-pill{background:#fff;color:#111}
.se-txt textarea.st-dark{background:rgba(17,17,17,.86);color:#fff}
.se-txt textarea.st-yellow{background:#FFD23F;color:#111}
.se-txt textarea.st-plain{color:#fff}
/* v11 : barre plus fine, harmonisation, animations */
nav.tabs{background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.5) 70%)}
nav.tabs .pill{box-shadow:0 6px 20px rgba(0,0,0,.07),inset 0 1px 0 #fff}
nav.tabs.mini .pill{box-shadow:0 4px 14px rgba(0,0,0,.06)}
nav.tabs button svg,nav.tabs button[aria-current="page"] svg{stroke-width:1.35;width:24px;height:24px}
nav.tabs button[aria-current="page"]{background:none}
nav.tabs .nav-ind{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:23px;background:#EFEEEA;z-index:0;opacity:0;transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .5s cubic-bezier(.3,1.25,.4,1),opacity .25s ease;pointer-events:none}
nav.tabs button[aria-current="page"] svg{animation:navPop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes navPop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.nav-av{box-shadow:0 0 0 1.35px #0F0F0F}
nav.tabs button:not([aria-current="page"]) .nav-av{box-shadow:0 0 0 1.35px #D5D4CF}
.icon-btn svg{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.icon-btn:active svg{transform:scale(.86)}
/* polices : tout en Manrope */
:root{--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--pixel:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
body,button,input,textarea,select{font-family:var(--body)}
.tile .t-n{font-size:11px;font-weight:600}
.cb-by{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.opt{font-size:12px;font-weight:500}
.conv time{font-size:12px;font-weight:500}
.err{font-size:13px;font-weight:600}
.or{font-size:13px}
.count,.dur,.count-badge{font-size:12px;font-weight:600}
.ps-bar .respect span{font-size:13px;font-weight:700;letter-spacing:0}
.toast{font-size:14px;font-weight:600;letter-spacing:0;border-radius:999px;padding:11px 18px;background:rgba(20,20,20,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
/* profil : nom, ville en italique, bio */
.phead .pname{margin:14px 0 0}
.pcity{display:block;margin-top:2px;font-style:italic;font-size:13.5px;font-weight:500;color:#737373}
.pbio{margin-top:6px;font-family:var(--body);font-weight:400}
.ep-f em{font-style:normal;font-weight:500;color:#a3a29d;margin-left:4px}
/* sticker sélectionnable */
.react-btn.pop-l .ps-ic{animation:stkOn .5s cubic-bezier(.3,1.4,.5,1)}
.react-btn.pop-off .ps-ic{animation:stkOff .35s ease}
@keyframes stkOn{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.3) rotate(-10deg)}70%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1) rotate(0)}}

.sw-ui::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.sw:checked+.sw-ui{background:var(--ink)}
.sw:checked+.sw-ui::after{transform:translateX(18px)}
.sw:focus-visible+.sw-ui{outline:2px solid var(--ink);outline-offset:2px}
/* statistiques */
.stats-sheet{max-height:90%}
.st-head{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.st-th{position:relative;flex:0 0 auto;width:54px;height:68px;border-radius:10px;overflow:hidden;background:#000}
.st-th img,.st-th video{width:100%;height:100%;object-fit:cover}
.st-head b{display:block;font-size:15px}
.st-head small{font-size:12.5px;color:#8e8e8a}
.st-icons{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0;border-block:1px solid #F0EFEB}
.st-icons span{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.st-icons .fs-ic{width:22px;height:22px}
.st-icons b{font-size:15px}
.st-sec{padding:14px 0;border-bottom:1px solid #F0EFEB}
.st-sec h4{margin:0 0 10px;font-size:15px;font-weight:800}
.st-big{display:flex;align-items:baseline;gap:6px;margin-bottom:10px}
.st-big b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.st-big span{color:#8e8e8a}
.st-split{height:8px;border-radius:999px;background:#DCDBD6;overflow:hidden}
.st-split i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.st-leg{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:#6f6e69}
.st-leg i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%}
.st-leg i.a{background:var(--ink)}
.st-leg i.b{background:#DCDBD6}
.st-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.st-row span{color:#4a4a47}
.st-row.tot{margin-top:4px;padding-top:10px;border-top:1px solid #F0EFEB;font-weight:800}
.st-note{margin:12px 0 18px;font-size:12px;line-height:1.5;color:#8e8e8a}
.ins{padding-bottom:24px}
.ins-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.ins-chips::-webkit-scrollbar{display:none}
.ins-chips button{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:700;color:#4a4a47}
.ins-chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:6px}
.ins-card{display:flex;flex-direction:column;gap:2px;min-width:0;padding:14px;border-radius:14px;background:var(--paper)}
.ins-card.big{grid-column:1/-1;background:#0F0F0F;color:#fff}
.ins-card span{font-size:12.5px;font-weight:700;color:#6f6e69}
.ins-card.big span{color:#bdbdbd}
.ins-card b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ins-card.big b{font-size:34px}
.ins-card small{font-size:11.5px;color:#8e8e8a}
.ins-card.big small{color:#a8a8a8}
.ins-card small.up{color:#1a8f4a}
.ins-card small.down{color:#d4142c}
.ins-chart{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.ins-chart i{flex:1;min-width:2px;border-radius:3px 3px 1px 1px;background:var(--ink);opacity:.85;transform-origin:bottom;animation:growUp .6s cubic-bezier(.22,.9,.25,1) both}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ins-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:#a3a29d}
.g-views{position:absolute;left:6px;bottom:6px;z-index:2;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.g-views .fs-ic{width:13px;height:13px;color:#0F0F0F}
.pdash{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 2px;padding:11px 14px;border-radius:14px;background:var(--paper);text-align:left;color:var(--ink)}
.pdash>span{flex:1;display:flex;flex-direction:column;min-width:0}
.pdash b{font-size:14px}
.pdash small{font-size:12.5px;color:#6f6e69}
.pdash i{font-style:normal;color:#b5b4ae;font-size:20px}
/* stories : vues + appui long */
.sv-views{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:999px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700}
.sv-views .fs-ic{width:22px;height:22px}
.sv .sv-head,.sv .sv-bars,.sv .sv-reply,.sv .sv-views{transition:opacity .2s}
.sv.held .sv-head,.sv.held .sv-bars,.sv.held .sv-reply,.sv.held .sv-views{opacity:0}
.svv-wrap{z-index:300}
.svv-sum{display:flex;gap:18px;padding:6px 2px 10px;margin-bottom:4px;border-bottom:1px solid #F0EFEB}
.svv-sum span{display:flex;align-items:center;gap:6px;font-size:14px}
.svv-sum .fs-ic{width:20px;height:20px;color:var(--ink)}
.svv-like{flex:0 0 auto;color:var(--ink)}
.svv-like .fs-ic{width:18px;height:18px}

/* ================= v17 : icônes fines et épurées, pouce bleu, barre colorée ================= */
:root{--like:#2F80ED}
.fs-ic .ic-f{fill:none;stroke:currentColor;stroke-width:1.35}
.fs-ic .ic-d,.fs-ic .ic-in{stroke-width:1.35}
.fs-ic .ic-sh,.fs-ic .ic-hl{display:none}
.ps-bar .respect,.ps-bar .round,.react-btn{color:#262626}
.on>.fs-ic.heart .ic-f{fill:var(--like);stroke:var(--like)}
.respect.on,.ps-bar .respect.on span,.ps-rail button.on span,.c-like.on span{color:var(--like)!important}
.react-btn.on .fs-ic .ic-f{fill:#EDEDED;stroke:#262626}
.burst>.fs-ic,.c-like.pop>.fs-ic,.sv-like.pop-l>.fs-ic{animation:likeIn .35s ease-out}
@keyframes likeIn{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.ps-bar .respect.burst::after,.ps-rail button.burst::after{border-color:var(--like);border-width:1px}
.ps-bar .respect.on .ps-ic,.react-btn.pop-l .ps-ic,.react-btn.pop-off .ps-ic{animation:none}
.ps-rail .fs-ic,.sv-like .fs-ic,.sv-likes .fs-ic,.sv-views .fs-ic{color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))!important}
.ps-rail .fs-ic{width:32px;height:32px}
.ps-rail .fs-ic .ic-f,.ps-rail .fs-ic .ic-d,.ps-rail .fs-ic .ic-in{stroke-width:1.5}
.sv-like.on,.sv-like.on svg{color:#fff;fill:none}
.n-like .ic-f,.n-story_like .ic-f,.n-comment_like .ic-f{fill:var(--like);stroke:var(--like)}
.n-reaction .ic-f{fill:none}
.g-views .fs-ic{color:#fff}
.stamp svg{filter:drop-shadow(0 6px 18px rgba(47,128,237,.35))}
/* onglets sélectionnés : trait seul, pas de remplissage */
nav.tabs button[aria-current="page"] .fs-ic .ic-f,.ptabs [aria-selected="true"] .fs-ic .ic-f,.mtabs [aria-selected="true"] .fs-ic .ic-f{fill:none}
.ptabs [aria-selected="true"] .fs-ic .ic-in,.mtabs [aria-selected="true"] .fs-ic .ic-in{stroke:currentColor}
.ptabs [aria-selected="true"] .fs-ic .ic-dot,.mtabs [aria-selected="true"] .fs-ic .ic-dot{fill:currentColor}
/* barre du bas : chaque onglet a sa couleur, en dégradé fin */
nav.tabs [data-nav="home"]{--acc-bg:rgba(79,139,255,.10);--acc-glow:rgba(79,139,255,.45);--acc-dot:#6A7DFF}
nav.tabs [data-nav="search"]{--acc-bg:rgba(20,200,180,.10);--acc-glow:rgba(20,200,180,.45);--acc-dot:#22B3C4}
nav.tabs [data-nav="clips"]{--acc-bg:rgba(255,77,141,.10);--acc-glow:rgba(255,77,141,.45);--acc-dot:#FF6170}
nav.tabs [data-nav="profile"]{--acc-bg:rgba(155,107,255,.10);--acc-glow:rgba(155,107,255,.45);--acc-dot:#9B6BFF}
nav.tabs .nav-ind{transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .5s cubic-bezier(.3,1.25,.4,1),opacity .25s ease,background .4s ease}
nav.tabs button .fs-ic .ic-f,nav.tabs button .fs-ic .ic-d,nav.tabs button .fs-ic .ic-in{stroke-width:1.3;transition:stroke .3s ease}
nav.tabs button .fs-ic .ic-dot{transition:fill .3s ease}
nav.tabs [data-nav="home"][aria-current="page"] .fs-ic *{stroke:url(#ng-home)}
nav.tabs [data-nav="search"][aria-current="page"] .fs-ic *{stroke:url(#ng-search)}
nav.tabs [data-nav="clips"][aria-current="page"] .fs-ic *{stroke:url(#ng-clips)}
nav.tabs [data-nav="clips"][aria-current="page"] .fs-ic .ic-dot{fill:url(#ng-clips);stroke:none}
nav.tabs button[aria-current="page"] .fs-ic{filter:drop-shadow(0 2px 5px var(--acc-glow))!important}
nav.tabs button[aria-current="page"]::after{display:block!important;content:"";position:absolute;bottom:3px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--acc-dot);box-shadow:0 0 6px var(--acc-glow)}
nav.tabs [data-nav="profile"][aria-current="page"] .nav-av{box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #9B6BFF,0 2px 8px rgba(155,107,255,.4)}

/* ================= v19 : lueur adoucie, bouton liquid glass ================= */
.s3-btn{border:0;border-radius:14px;overflow:hidden;isolation:isolate;
 background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.06) 48%,rgba(255,255,255,.03) 52%,rgba(255,255,255,.09) 100%);
 -webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 18px rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.45)}

/* ================= v20 : sticker libre, enregistrements, paramètres, boutique ================= */
/* sticker écrit */
.stw .sheet-list{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.stw-prev{position:relative;height:96px;margin:4px 0 12px;border-radius:16px;background:radial-gradient(120% 120% at 20% 0%,#3a3a3a,#0F0F0F 70%);overflow:hidden}
.stw-prev .stk{left:50%;top:50%;--r:-4deg;font-size:26px}
.stw-prev .stk.bump{animation:stwBump .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes stwBump{0%{transform:translate(-50%,-50%) rotate(-4deg) scale(.86)}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}}
.stw-f{position:relative}
.stw-f input{width:100%;border:1px solid var(--paper-line);background:var(--paper);border-radius:12px;padding:13px 54px 13px 14px;font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.stw-f input::placeholder{text-transform:none;letter-spacing:0;font-weight:500;color:#a3a29d}
.stw-n{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:#a3a29d}
.stw-cols{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 4px}
.stw-c{width:30px;height:30px;border-radius:9px;border:1px solid rgba(0,0,0,.12);transition:transform .2s}
.stw-c.on{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.stw-hint{margin:10px 2px 14px;font-size:12.5px;color:#8e8e8a}
.stw-go{width:100%;height:48px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:opacity .2s,transform .15s}
.stw-go:disabled{opacity:.35}
.stw-go:active{transform:scale(.98)}
/* enregistrer */
.save-btn{margin-right:2px}
.save-btn.on .fs-ic .ic-f{fill:currentColor}
.save-btn.pop>.fs-ic{animation:fsPop .5s cubic-bezier(.3,1.4,.5,1)}
.ptabs.three{grid-template-columns:1fr 1fr 1fr}
.ptabs.three .ptab-ind{width:33.334%}
.ptabs.three button{font-size:12.5px;gap:6px}
.sv-empty{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:260px;margin:0 auto;font-size:13px;line-height:1.45;color:#8e8e8a}
.sv-empty svg{width:34px;height:34px;color:var(--ink);margin-bottom:4px}
.sv-empty b{color:var(--ink);font-size:15px}
/* paramètres */
.set{padding-top:6px;padding-bottom:30px;display:flex;flex-direction:column}
.set-me{display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:18px;background:var(--paper);text-align:left;margin-bottom:6px;transition:transform .2s}
.set-me:active,.set-row:active{transform:scale(.985)}
.set-me>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.set-me b{font-size:16.5px;font-weight:800;color:var(--ink)}
.set-me small{font-size:12.5px;color:#8e8e8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-me i,.set-row i{font-style:normal;font-size:20px;color:#b5b4ae}
.set-h{margin:22px 6px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a29d}
.set-card{border-radius:18px;background:var(--paper);overflow:hidden}
.set-card+.set-card{margin-top:14px}
.set-row{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;text-align:left;transition:background .2s,transform .2s}
.set-row+.set-row{border-top:1px solid var(--paper-line)}
.set-row:hover{background:rgba(0,0,0,.025)}
.set-ic{width:36px;height:36px;border-radius:11px;background:var(--bg);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.set-t{flex:1;min-width:0;display:flex;flex-direction:column}
.set-t b{font-size:14.5px;font-weight:700;color:var(--ink)}
.set-t small{font-size:12.5px;color:#8e8e8a}
.set-row.danger .set-t b,.set-row.danger .set-ic{color:#ED4956}
.set-row.danger i{display:none}
.set-theme{padding:6px}
.set-seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--bg)}
.set-seg button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 9px;font-size:12.5px;font-weight:700;color:#8e8e8a;transition:color .3s}
.set-seg button[aria-pressed="true"]{color:var(--ink)}
.set-seg i{position:absolute;left:4px;top:4px;bottom:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);transition:transform .45s cubic-bezier(.3,1.25,.4,1)}
.set-note{margin:8px 8px 4px;font-size:12px;color:#a3a29d}
.set-foot{margin:22px 0 0;text-align:center;font-size:11.5px;color:#b5b4ae}
html.theme-anim body,html.theme-anim .app,html.theme-anim main,html.theme-anim .top,html.theme-anim .set-card,html.theme-anim .set-me,html.theme-anim .card{transition:background-color .4s ease,color .4s ease}
/* boutique v20 */
@media (prefers-reduced-motion:reduce){.s4 .s3-stage,.s4-cta,.s4-kicker{transition:none}}

/* ================= v21 : stickers sobres, découpe fine, rendu propre ================= */
.stk:not(.perf):not(.st-plain):not(.st-pill):not(.st-dark):not(.st-yellow){
 font-family:var(--body);font-weight:800;font-size:calc(clamp(11.5px,3.3vw,14px) * var(--sz,1));letter-spacing:.09em;text-transform:uppercase;line-height:1;
 padding:.62em .85em .58em;border-radius:6px;border:1.5px solid #fff;
 box-shadow:0 1px 1.5px rgba(0,0,0,.22),0 6px 14px -4px rgba(0,0,0,.35);
 -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stk.white{background:#FAFAF8;color:#141414;border-color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 1px 1.5px rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.3)}
.stk.black{background:#141414;color:#F5F5F3}
.stk.grey{background:#8C8C8A;color:#fff}
.stk.yellow{background:#E9D27A;color:#1a1a1a}
.stk.pink{background:#E7A9BF;color:#1a1a1a}
.stk.mint{background:#A9D6C3;color:#1a1a1a}
.stk.red{background:#D9534F;color:#fff}
.stk.blue{background:#AFC3D9;color:#1a1a1a}
.stk.holo{color:#1a1a1a;background:linear-gradient(115deg,#ECEEF2 0%,#E3ECF4 30%,#EFE7F2 55%,#F2EFE4 80%,#ECEEF2 100%);background-size:220% 100%;animation:holo 9s linear infinite}
.stk.outline{background:rgba(20,20,20,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-color:rgba(255,255,255,.85)}
/* réactions sur les publications */
.cbub{gap:7px}
.cb{gap:3px;animation:stkIn .45s cubic-bezier(.22,.9,.25,1) both}
.cb:nth-child(2){margin-left:14px}
.cb.new .stk{box-shadow:0 1px 1.5px rgba(0,0,0,.22),0 6px 14px -4px rgba(0,0,0,.35)}
.cb-by{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.92);background:rgba(15,15,15,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:2px 6px;border-radius:4px;margin-left:2px}
.cb.out{animation:stkOut .4s ease-in forwards}
@keyframes stkIn{from{opacity:0;transform:rotate(var(--rot)) translateY(6px) scale(.94)}to{opacity:1;transform:rotate(var(--rot)) translateY(0) scale(1)}}
@keyframes stkOut{to{opacity:0;transform:rotate(var(--rot)) translateY(-6px) scale(.96)}}
.stw-prev .stk{font-size:17px!important;--r:-2deg}
@keyframes stwBump{0%{transform:translate(-50%,-50%) rotate(-2deg) scale(.95)}100%{transform:translate(-50%,-50%) rotate(-2deg) scale(1)}}
.stw-c{border-radius:7px}

/* ================= v23 : stickers fins, lueur douce derrière, mouvement perpétuel léger ================= */
.stk:not(.perf):not(.st-plain):not(.st-pill):not(.st-dark):not(.st-yellow){
 --gl:rgba(255,255,255,.55);
 font-weight:700;font-size:calc(clamp(10.5px,2.9vw,12px) * var(--sz,1));letter-spacing:.11em;line-height:1;
 padding:.42em .8em .38em;border-radius:5px;border:1px solid rgba(255,255,255,.95);
 box-shadow:0 0 10px 0 var(--gl),0 1px 2px rgba(0,0,0,.18);
 animation:stkFloat 6s ease-in-out infinite,stkGlow 4.2s ease-in-out infinite}
.stk.white{--gl:rgba(255,255,255,.6)}
.stk.black{--gl:rgba(255,255,255,.28)}
.stk.grey{--gl:rgba(220,220,220,.4)}
.stk.yellow{--gl:rgba(233,210,122,.6)}
.stk.pink{--gl:rgba(231,169,191,.6)}
.stk.mint{--gl:rgba(169,214,195,.6)}
.stk.red{--gl:rgba(217,83,79,.5)}
.stk.blue{--gl:rgba(175,195,217,.6)}
.stk.holo{--gl:rgba(226,232,246,.65)}
.stk.holo:not(.perf){animation:holo 9s linear infinite,stkFloat 6s ease-in-out infinite,stkGlow 4.2s ease-in-out infinite}
.cb.new .stk{box-shadow:0 0 10px 0 var(--gl),0 1px 2px rgba(0,0,0,.18)}
@keyframes stkFloat{0%,100%{translate:0 0;rotate:0deg}25%{translate:.6px -1.2px;rotate:.35deg}50%{translate:0 -2px;rotate:0deg}75%{translate:-.6px -1px;rotate:-.35deg}}
@keyframes stkGlow{0%,100%{box-shadow:0 0 8px 0 var(--gl),0 1px 2px rgba(0,0,0,.18)}50%{box-shadow:0 0 16px 2px var(--gl),0 1px 2px rgba(0,0,0,.18)}}
.cb:nth-child(2) .stk,.stk:nth-of-type(2){animation-delay:-2s,-1.4s}
.cb:nth-child(3) .stk,.stk:nth-of-type(3){animation-delay:-4s,-2.8s}
.stk.holo:nth-of-type(2),.cb:nth-child(2) .stk.holo{animation-delay:0s,-2s,-1.4s}
.stk.holo:nth-of-type(3),.cb:nth-child(3) .stk.holo{animation-delay:0s,-4s,-2.8s}
.cb{gap:4px}
.cbub{gap:9px}
.stw-prev .stk{font-size:15px!important}
@media (prefers-reduced-motion:reduce){.stk{animation:none!important}}

/* ================= v24 : stickers adultes (monochrome) + menu sticker épuré ================= */
.stk:not(.perf):not(.st-plain):not(.st-pill):not(.st-dark):not(.st-yellow){
 --gl:rgba(255,255,255,.35);

 padding:.5em .85em .46em;border-radius:3px;border-width:1px;border-style:solid;box-shadow:0 0 12px 0 var(--gl),0 1px 2px rgba(0,0,0,.14)}

/* menu sticker */
