function openCropper(file,aspect,outW,outH,title){
 return new Promise(resolve=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
   const d=document.createElement('div');d.className='layer crop-wrap';
   d.innerHTML=`<div class="crop"><div class="crop-head"><button type="button" class="crop-txt" data-c="cancel">Annuler</button><b>${esc(title)}</b><button type="button" class="crop-txt strong" data-c="ok">Valider</button></div>
    <div class="crop-stage"><img alt="" draggable="false"><div class="crop-box ${aspect===1?'sq':''}"><i class="cg cg1"></i><i class="cg cg2"></i><i class="cg cg3"></i><i class="cg cg4"></i><span class="ch tl" data-h="tl"></span><span class="ch tr" data-h="tr"></span><span class="ch bl" data-h="bl"></span><span class="ch br" data-h="br"></span></div></div>
    <p class="crop-hint">Déplace le cadre et tire sur un coin pour l’agrandir</p></div>`;
   document.body.appendChild(d);
   const st=d.querySelector('.crop-stage'),im=st.querySelector('img'),bx=st.querySelector('.crop-box');im.src=url;
   const iw=img.naturalWidth,ih=img.naturalHeight;
   const maxW=Math.min(innerWidth-32,460),maxH=Math.min(innerHeight*0.64,600);
   const k=Math.min(maxW/iw,maxH/ih);const dw=Math.round(iw*k),dh=Math.round(ih*k);
   st.style.width=dw+'px';st.style.height=dh+'px';
   const MIN=Math.min(56,dw,dh/ (1/aspect));
   let w=Math.min(dw,dh*aspect)*0.88,h=w/aspect,x=(dw-w)/2,y=(dh-h)/2;
   const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
   const paint=()=>{bx.style.left=x+'px';bx.style.top=y+'px';bx.style.width=w+'px';bx.style.height=h+'px'};paint();
   let mode=null,sx=0,sy=0,o=null;
   bx.addEventListener('pointerdown',e=>{e.preventDefault();bx.setPointerCapture(e.pointerId);mode=e.target.dataset.h||'move';sx=e.clientX;sy=e.clientY;o={x,y,w,h};bx.classList.add('drag')});
   bx.addEventListener('pointermove',e=>{if(!mode)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode==='move'){x=cl(o.x+dx,0,dw-o.w);y=cl(o.y+dy,0,dh-o.h)}
    else{const L=mode.includes('l'),T=mode.includes('t');const ax=L?o.x+o.w:o.x,ay=T?o.y+o.h:o.y;
     let nw=Math.max(L?o.w-dx:o.w+dx,(T?o.h-dy:o.h+dy)*aspect);
     const lim=Math.min(L?ax:dw-ax,(T?ay:dh-ay)*aspect);nw=cl(nw,Math.min(MIN,lim),lim);
     w=nw;h=nw/aspect;x=L?ax-w:ax;y=T?ay-h:ay}
    paint()});
   const end=()=>{mode=null;bx.classList.remove('drag')};bx.addEventListener('pointerup',end);bx.addEventListener('pointercancel',end);
   d.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;
    if(b.dataset.c==='cancel'){d.remove();URL.revokeObjectURL(url);resolve(null);return}
    const s=iw/dw,cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
    const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(img,x*s,y*s,w*s,h*s,0,0,outW,outH);
    cv.toBlob(bl=>{d.remove();URL.revokeObjectURL(url);resolve(bl?new File([bl],'crop.jpg',{type:'image/jpeg'}):null)},'image/jpeg',.9);
   });
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Image illisible');resolve(null)};
  img.src=url;
 });
}

let cmtLikes={},cmtReply=null,cmtOpen=new Set();
async function loadCmtLikes(pid){const ids=(commentsBy[pid]||[]).map(c=>c.id);for(let i=0;i<ids.length;i+=80){const part=ids.slice(i,i+80);const {data}=await sb.from('comment_likes').select('comment_id,user_id').in('comment_id',part);part.forEach(x=>cmtLikes[x]=new Set());(data||[]).forEach(r=>cmtLikes[r.comment_id]&&cmtLikes[r.comment_id].add(r.user_id))}}
function cmtTree(pid){
 const list=(commentsBy[pid]||[]).filter(c=>!blocked.has(c.user_id)),byId={};list.forEach(c=>byId[c.id]=c);
 const root=c=>{let x=c,n=0;while(x.parent_id&&byId[x.parent_id]&&n++<30)x=byId[x.parent_id];return x};
 const tops=[],kids={};list.forEach(c=>{const r=root(c);if(r===c)tops.push(c);else(kids[r.id]=kids[r.id]||[]).push(c)});
 return {tops,kids,byId};
}
function cmtRow(c,pid,own,reply,byId){
 const lk=cmtLikes[c.id]||new Set(),on=lk.has(me.id),par=reply&&c.parent_id?byId[c.parent_id]:null;
 return `<div class="cmt2 ${reply?'reply':''}" data-cid="${c.id}">${av(c.user_id,reply?26:34)}<div class="c-body"><div class="c-line"><button class="c-who" data-act="open-user" data-u="${c.user_id}">${esc(prof(c.user_id).handle)}${vb(c.user_id)}</button><span class="c-time">${ago(c.created_at)}</span></div><p class="c-text">${par&&par.parent_id?`<span class="c-at">@${esc(prof(par.user_id).handle)}</span> `:''}${esc(c.text)}</p><div class="c-acts"><button data-act="cmt-reply" data-id="${c.id}" data-p="${pid}">Répondre</button>${lk.size?`<span class="c-nl">${lk.size} j’aime</span>`:''}${c.user_id===me.id||own||isAdmin()?`<button data-act="del-cmt" data-id="${c.id}" data-p="${pid}">Supprimer</button>`:''}${c.user_id!==me.id?`<button class="c-rep" data-act="report" data-t="comment" data-id="${c.id}" data-u="${c.user_id}">Signaler</button>`:''}</div></div><button class="c-like ${on?'on':''}" data-act="cmt-like" data-id="${c.id}" data-p="${pid}" aria-label="J’aime le commentaire" aria-pressed="${on}">${I.heartSm}<span>${lk.size||''}</span></button></div>`;
}
function paintComments(pid){
 const box=$('cmt-list');if(!box)return;const p=findPost(pid),own=!!(p&&p.user_id===me.id),{tops,kids,byId}=cmtTree(pid);
 box.innerHTML=tops.length?tops.map(c=>{const k=kids[c.id]||[],open=cmtOpen.has(c.id);return `<div class="c-thread">${cmtRow(c,pid,own,false,byId)}${k.length?`<div class="c-kids">${open?k.map(x=>cmtRow(x,pid,own,true,byId)).join(''):''}<button class="c-more" data-act="cmt-toggle" data-id="${c.id}" data-p="${pid}"><i></i>${open?'Masquer les réponses':(k.length>1?`Voir les ${k.length} réponses`:'Voir la réponse')}</button></div>`:''}</div>`}).join(''):'<div class="empty">Aucun commentaire. Lance la discussion.</div>';
}
function paintReplyBar(){const bar=$('c-replying');if(!bar)return;bar.hidden=!cmtReply;if(cmtReply)bar.querySelector('b').textContent='@'+prof(cmtReply.user_id).handle;const i=$('ci');if(i)i.placeholder=cmtReply?'Ta réponse…':'Ajoute un commentaire…'}
async function openComments(id){

 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet cmt-sheet" role="dialog" aria-label="Commentaires">

 $('cf2').addEventListener('submit',async e=>{

// ================= CHECK & VALIDATION PAR LA COMMUNAUTÉ =================
// Le « check » : petite coche verte qu'on coche sur un profil quand on respecte le travail du sportif.
// Un check par profil (retirable). 100 checks de membres différents = « Validé par la communauté ».
// Seuls les comptes de plus de 7 jours qui ont déjà publié peuvent checker (vérifié par le serveur).
const respectCache={};
async function loadRespect(uid){try{const {data,error}=await sb.rpc('fs_respect_info',{pid:uid});if(error||!data)return null;respectCache[uid]=data;return data}catch(e){return null}}
const RESP_IC='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5l4 4L18.5 8"/></svg>';
const cvTag=()=>`<span class="cv-tag" title="Au moins 100 membres différents l’ont checké"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></svg>Validé par la communauté</span>`;
const respBtn=(uid,ri)=>`<button type="button" class="resp-btn ${ri.given?'on':''}" data-act="respect" data-u="${uid}" aria-pressed="${ri.given?'true':'false'}" aria-label="${ri.given?'Retirer ton check':'Checker ce profil'}"><span class="rb-ic">${RESP_IC}</span><span class="rb-t">${ri.given?'Checké':'Check'}</span></button>`;
const CHK_SEEN='fs_check_info_seen';
function chkSeen(){try{return localStorage.getItem(CHK_SEEN)==='1'}catch(e){return true}}
function chkMarkSeen(){try{localStorage.setItem(CHK_SEEN,'1')}catch(e){}}
function paintCheck(uid,data){
 const btn=main.querySelector(`.resp-btn[data-u="${uid}"]`);
 if(btn){btn.classList.toggle('on',!!data.given);btn.setAttribute('aria-pressed',data.given?'true':'false');btn.setAttribute('aria-label',data.given?'Retirer ton check':'Checker ce profil');const t=btn.querySelector('.rb-t');if(t)t.textContent=data.given?'Checké':'Check';if(data.given){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}}
 const n=$('st-respects');if(n){n.textContent=fmt(data.count);const bc=n.closest('.bn-chk');if(bc){bc.classList.toggle('ok',!!data.validated);bc.setAttribute('aria-label',data.count+' check'+(data.count>1?'s':'')+', voir le Check')}}
 const slot=$('cv-slot');if(slot)slot.innerHTML=data.validated?cvTag():'';
 const g=main.querySelector('.gutter');if(g)g.classList.toggle('cv-on',!!data.validated);
}
// Fiche « Le Check » : explications + progression vers la validation + bouton d'action

 const th=ri.threshold||100,n=ri.count||0,pc=Math.min(100,Math.round(n/th*100)),left=Math.max(0,th-n);

 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet ck-sheet ck2" role="dialog" aria-label="Check"><div class="stw-top"><b></b><button type="button" class="stw-x" data-act="close-sheet-btn" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-list gutter">
  <div class="ck2-head"><span class="ck2-ic">${RESP_IC}</span><div><b>Check</b><p>${line}</p></div></div>
  <div class="ck2-count"><b>${fmt(n)}</b><span>check${n>1?'s':''}</span><em class="${ri.validated?'ok':''}">${ri.validated?'Validé par la communauté':`${fmt(left)} avant d’être validé`}</em></div>
  <span class="ck-bar"><i style="width:${pc}%"></i></span>

  ${!mine&&ri.max?`<p class="ck2-left">${ri.given?'':Math.max(0,ri.max-(ri.my_given||0))?`Il te reste <b>${Math.max(0,ri.max-(ri.my_given||0))}</b> check${ri.max-(ri.my_given||0)>1?'s':''} à donner`:'Tu as donné tes 5 checks : retires-en un pour checker ce profil'}</p>`:''}

async function doCheck(uid,fromSheet){
 if(doCheck.busy)return;doCheck.busy=true;
 try{
  const {data,error}=await sb.rpc('fs_toggle_respect',{target:uid});
  if(error||!data){toast('Le check n’est pas encore disponible, réessaie plus tard.');return}
  if(data.status!=='ok'){toast(RESP_MSG[data.status]||RESP_MSG.invalid);return}
  respectCache[uid]=data;paintCheck(uid,data);if(data.given&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  if(fromSheet)layer.innerHTML='';
  toast(data.given?'Check envoyé à @'+(prof(uid).handle||''):'Check retiré');
 }finally{doCheck.busy=false}
}
const RESP_MSG={limit:'Tu as déjà donné tes 5 checks : retires-en un pour checker quelqu’un d’autre',too_new:'Ton compte doit avoir plus de 7 jours pour checker',no_post:'Publie au moins une fois pour pouvoir checker',banned:'Ton compte ne peut pas checker',blocked:'Impossible avec ce compte',slow:'Doucement : réessaie un peu plus tard',invalid:'Action impossible'};
async function toggleRespect(btn,uid){
 if(!chkSeen()){chkMarkSeen();openCheckInfo(uid);return}
 await doCheck(uid,false);
}
// ================= PARTAGE VERS INSTAGRAM / TIKTOK =================
// Génère une image au format story (1080×1920) avec la marque Freestyle, puis l'envoie au menu de partage
// du téléphone (Instagram, TikTok, Snapchat…). Sur ordinateur, l'image est téléchargée.
function cvImg(src){return new Promise(res=>{if(!src)return res(null);const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src})}
function cvVideoFrame(src){return new Promise(res=>{if(!src)return res(null);const v=document.createElement('video');v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;v.preload='auto';let done=false;const end=x=>{if(!done){done=true;res(x)}};v.onloadeddata=()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/3)}catch(e){end(null)}};v.onseeked=()=>end(v);v.onerror=()=>end(null);setTimeout(()=>end(null),6000);v.src=src})}
function cvCover(ctx,img,x,y,w,h,r){const iw=img.videoWidth||img.naturalWidth||img.width,ih=img.videoHeight||img.naturalHeight||img.height;if(!iw||!ih)return;const k=Math.max(w/iw,h/ih),dw=iw*k,dh=ih*k;ctx.save();cvRound(ctx,x,y,w,h,r);ctx.clip();ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore()}
function cvRound(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cvWrap(ctx,text,maxW,maxLines){const words=String(text||'').split(/\s+/),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length===maxLines)break}else cur=t}if(lines.length<maxLines&&cur)lines.push(cur);if(lines.length===maxLines&&words.join(' ').length>lines.join(' ').length)lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…';return lines}
const CV_FONT='Manrope, -apple-system, Segoe UI, Roboto, sans-serif';
async function cvBase(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const ctx=c.getContext('2d');const g=ctx.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#1a1a1a');g.addColorStop(1,'#0F0F0F');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);try{await document.fonts.ready}catch(e){}return {c,ctx}}
async function cvFooter(ctx){const lg=await cvImg(LOGO);if(lg){const h=96,w=lg.naturalWidth/lg.naturalHeight*h;ctx.save();ctx.filter='invert(1)';ctx.drawImage(lg,540-w/2,1690,w,h);ctx.restore()}ctx.fillStyle='#8a8a8a';ctx.font='600 34px '+CV_FONT;ctx.textAlign='center';ctx.fillText('Retrouve-moi sur Freestyle',540,1840)}
async function cvAvatar(ctx,uid,x,y,s){const u=prof(uid);const im=await cvImg(u.avatar_url);ctx.save();cvRound(ctx,x,y,s,s,s*.3);ctx.clip();if(im)cvCover(ctx,im,x,y,s,s,0);else{ctx.fillStyle=hashCol(uid);ctx.fillRect(x,y,s,s);ctx.fillStyle='#fff';ctx.font='800 '+Math.round(s*.46)+'px '+CV_FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((u.name||'?')[0].toUpperCase(),x+s/2,y+s/2+2);ctx.textBaseline='alphabetic'}ctx.restore()}
async function buildPostCard(p){
 const {c,ctx}=await cvBase();const u=prof(p.user_id);
 await cvAvatar(ctx,p.user_id,90,150,110);
 ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='800 50px '+CV_FONT;ctx.fillText('@'+(u.handle||''),225,200);
 ctx.fillStyle='#9a9a9a';ctx.font='600 34px '+CV_FONT;ctx.fillText(p.sport||'',225,248);
 if(p.kind==='shout'){
  ctx.fillStyle='#fff';ctx.font='700 64px '+CV_FONT;const lines=cvWrap(ctx,p.caption,880,12);const lh=86,top=Math.max(380,900-lines.length*lh/2);
  ctx.fillStyle='rgba(255,255,255,.06)';cvRound(ctx,70,top-100,940,(lines.length-1)*lh+160,44);ctx.fill();ctx.fillStyle='#fff';
  lines.forEach((l,i)=>ctx.fillText(l,110,top+i*lh));
 }else{
  const m=(p.media||[])[0];const im=m?(m.type==='video'?await cvVideoFrame(m.url):await cvImg(m.url)):null;
  if(im){ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=40;cvRound(ctx,70,330,940,1180,44);ctx.fillStyle='#000';ctx.fill();ctx.restore();cvCover(ctx,im,70,330,940,1180,44)}
  else{const col=SPORTS[p.sport]||SPORTS.Autre;const g=ctx.createLinearGradient(70,330,1010,1510);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);ctx.fillStyle=g;cvRound(ctx,70,330,940,1180,44);ctx.fill()}
  if(m&&m.type==='video'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.arc(540,920,80,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(515,875);ctx.lineTo(515,965);ctx.lineTo(590,920);ctx.closePath();ctx.fill()}
  if(p.caption){ctx.fillStyle='#e8e8e8';ctx.font='600 38px '+CV_FONT;cvWrap(ctx,p.caption,900,2).forEach((l,i)=>ctx.fillText(l,90,1580+i*50))}
 }
 await cvFooter(ctx);return c;
}
async function buildProfileCard(uid){
 const {c,ctx}=await cvBase();const u=prof(uid);let ri=respectCache[uid];if(!ri)ri=await loadRespect(uid);
 const bn=await cvImg(u.banner_url);if(bn){ctx.globalAlpha=.55;cvCover(ctx,bn,0,0,1080,760,0);ctx.globalAlpha=1;const g=ctx.createLinearGradient(0,380,0,760);g.addColorStop(0,'rgba(15,15,15,0)');g.addColorStop(1,'#141414');ctx.fillStyle=g;ctx.fillRect(0,380,1080,380)}
 await cvAvatar(ctx,uid,390,520,300);
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 72px '+CV_FONT;ctx.fillText(u.name||u.handle||'',540,940);
 ctx.fillStyle='#9a9a9a';ctx.font='600 40px '+CV_FONT;ctx.fillText('@'+(u.handle||'')+(u.sport?' · '+u.sport:''),540,1000);
 if(ri){const n=ri.count||0;ctx.fillStyle=ri.validated?'#22A55C':'rgba(255,255,255,.08)';cvRound(ctx,340,1090,400,130,34);ctx.fill();
  ctx.strokeStyle=ri.validated?'#fff':'#3DD47D';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(400,1157);ctx.lineTo(430,1187);ctx.lineTo(485,1127);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='800 64px '+CV_FONT;ctx.textAlign='left';ctx.fillText(fmt(n),515,1180);ctx.textAlign='center';
  ctx.fillStyle=ri.validated?'#3DD47D':'#8a8a8a';ctx.font='700 38px '+CV_FONT;ctx.fillText(ri.validated?'Validé par la communauté':'check'+(n>1?'s':''),540,1290)}
 await cvFooter(ctx);return c;
}
async function shareCanvas(c,name,link){
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob){toast('Image impossible à créer');return}
 const file=new File([blob],name,{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Freestyle',text:link?('Sur Freestyle : '+link):'Freestyle'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Image enregistrée : publie-la en story')
}
async function shareStoryCard(kind,id){

  else{const c=await buildProfileCard(id);await shareCanvas(c,'freestyle-'+(prof(id).handle||'profil')+'.png',BASE_URL+'?u='+encodeURIComponent(prof(id).handle))}
 }catch(e){console.error('[Freestyle]',e);toast('Partage impossible pour le moment')}
}
async function shareClipVideo(id){

 q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(async()=>{const v=q.value.trim().replace(/^@/,'');if(!v){paint(base);return}const safe=v.replace(/[%,()*]/g,'');const {data}=await sb.from('profiles').select('id,handle,name,sport,bio,city,avatar_url,banner_url,prs,verified').or(`handle.ilike.%${safe}%,name.ilike.%${safe}%`).neq('id',me.id).limit(15);(data||[]).forEach(x=>P[x.id]=x);if(q.value.trim().replace(/^@/,'')===v)paint((data||[]).map(x=>x.id).filter(x=>!blocked.has(x)))},250)});
 res.addEventListener('click',async e=>{const b=e.target.closest('[data-pp]');if(!b)return;b.disabled=true;b.querySelector('i').textContent='Envoi…';await partnerRequest(b.dataset.pp);layer.innerHTML=''});
 setTimeout(()=>q.focus(),250);
}
async function renderInsights(){
 topEl.innerHTML=`<button class="icon-btn" data-act="back" aria-label="Retour">${I.back}</button><h1 class="ptitle">Tableau de bord</h1><span class="icon-btn"></span>`;
 const chips=`<div class="ins-chips">${[7,30,90].map(d=>`<button data-act="ins-days" data-k="${d}" aria-pressed="${d===insDays}">${d} jours</button>`).join('')}</div>`;
 main.innerHTML=`<div class="gutter ins">${chips}${loadingHTML()}</div>`;
 const days=insDays;const {data:s,error}=await sb.rpc('fs_account_stats',{days});
 if(view!=='insights'||days!==insDays)return;
 if(error||!s){main.innerHTML=`<div class="gutter ins">${chips}<div class="empty">Statistiques indisponibles pour le moment.</div></div>`;return}
 const delta=s.reach_prev?Math.round((s.reach-s.reach_prev)/s.reach_prev*100):null,fol=pct(s.reach_followers,s.reach),mx=Math.max(1,...s.daily.map(x=>x.v));
 const dd=x=>new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
 main.innerHTML=`<div class="gutter ins">${chips}
  <div class="ins-grid">
   <div class="ins-card big"><span>Vues</span><b>${fmt(s.views)}</b><small>sur tes posts et clips</small></div>
   <div class="ins-card"><span>Comptes touchés</span><b>${fmt(s.reach)}</b>${delta!==null?`<small class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta} % vs période précédente</small>`:'<small>personnes différentes</small>'}</div>
   <div class="ins-card"><span>Interactions</span><b>${fmt(s.interactions)}</b><small>${fmt(s.likes)} j’aime · ${fmt(s.comments)} comm.</small></div>
   <div class="ins-card"><span>Abonnés</span><b>${fmt(s.followers)}</b><small class="${s.new_followers?'up':''}">+${fmt(s.new_followers)} sur la période</small></div>
   <div class="ins-card"><span>Visites du profil</span><b>${fmt(s.profile_visits)}</b><small>${fmt(s.shares)} partage${s.shares>1?'s':''}</small></div>
  </div>
  <div class="st-sec"><h4>Nouveaux comptes touchés par jour</h4><div class="ins-chart" role="img" aria-label="Comptes touchés par jour">${s.daily.map(x=>`<i style="height:${Math.max(3,x.v/mx*100)}%" title="${dd(x.d)} : ${x.v}"></i>`).join('')}</div><div class="ins-axis"><span>${s.daily.length?dd(s.daily[0].d):''}</span><span>Aujourd’hui</span></div></div>
  <div class="st-sec"><h4>Audience touchée</h4><div class="st-split"><i style="width:${fol}%"></i></div><div class="st-leg"><span><i class="a"></i>Abonnés ${fol} %</span><span><i class="b"></i>Non-abonnés ${s.reach?100-fol:0} %</span></div></div>
  <div class="st-sec"><h4>Meilleurs contenus</h4>${s.top.length?`<div class="grid ins-top">${s.top.map(p=>`<button data-act="post-stats" data-id="${p.id}" aria-label="Statistiques de ce contenu">${p.kind==='shout'?`<span class="g-shout"><span>${esc((p.caption||'').slice(0,90))}</span></span>`:mediaHTML(p.media&&p.media.length?[p.media[0]]:[],p.sport)}<span class="g-views">${I.playV}${fmt(p.views)}</span></button>`).join('')}</div>`:'<div class="empty">Publie pendant cette période pour voir tes meilleurs contenus.</div>'}</div>
 </div>`;
 main.querySelectorAll('.grid video').forEach(v=>{v.dataset.w='1';v.muted=true;v.removeAttribute('autoplay');v.pause()});
}

// ================= DÉMARRAGE =================
async function refreshHome(){await Promise.all([loadFollowing(),loadBlocks()]);await Promise.all([loadFeed(),loadStories()])}
let booted=false;
async function boot(){
 const {data:{session:s}}=await sb.auth.getSession();session=s;
 let expired=false;try{expired=sessionStorage.getItem('fs-reset-expired')==='1';if(expired)sessionStorage.removeItem('fs-reset-expired')}catch(e){}
 if(session&&recoveryPending()){history.replaceState(null,'',BASE_URL);me=null;view='newpw';render();return}
 if(!session){me=null;if(expired){authMode='login';authErr='';authInfo='';view='forgot';forgotState={expired:true};render();return}view='auth';render();return}
 if(await checkMyBan())return;
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(error){console.error(error);toast('Connexion au serveur impossible');}
 if(!p||!p.onboarded){me=null;obExisting=p||null;if(p&&!ob.name)ob.name='';view='onboard';render();return}
 me=p;P[me.id]=p;paintNavAv();
 main.innerHTML=loadingHTML('Chargement du fil…');
 await Promise.all([refreshHome(),loadConvs(),loadNotifs(),loadClips(),loadAdmins(),loadBlocks(),loadGroups(),loadAnnouncements(),loadNotifPrefs(),loadSaved()]);recountUnread();loadBans();
 subscribeRealtime();
 const qpost=new URLSearchParams(location.search).get('p');if(qpost){history.replaceState(null,'',BASE_URL);const {data:pp}=await sb.from('feed').select('*').eq('id',qpost).maybeSingle();if(pp){await loadProfiles([pp.user_id]);if(pp.kind==='clip'){clipsList=[pp,...clipsList.filter(x=>x.id!==pp.id)];view='clips';arg=pp.id}else{feed=[pp,...feed.filter(x=>x.id!==pp.id)];await loadComments(feed.map(x=>x.id));view='home';setTimeout(()=>document.querySelector(`.card[data-id="${pp.id}"]`)?.scrollIntoView({block:'start'}),80)}}else toast('Ce post n’existe plus')}
 const qu=new URLSearchParams(location.search).get('u');if(qu){history.replaceState(null,'',BASE_URL);const {data:tp}=await sb.from('profiles').select('id,handle,name,sport,bio,city,avatar_url,banner_url,prs,verified').eq('handle',qu.toLowerCase()).maybeSingle();if(tp){P[tp.id]=tp;view='profile';arg=tp.id}}
 cleanExpiredStories();
 if(!['home','clips','messages','profile','create'].includes(view))view='home';
 render();
 swInit().then(pushSync);
 {const qs=new URLSearchParams(location.search);if(qs.get('pings')){history.replaceState(null,'',BASE_URL);setTimeout(openNotifs,300)}else if(qs.get('chat')){const c=qs.get('chat');history.replaceState(null,'',BASE_URL);hist=[];nav('chat',c)}}
 let wel=false;try{wel=localStorage.getItem('fs-welcome')==='1'}catch(e){}
 if(wel){try{localStorage.removeItem('fs-welcome')}catch(e){}setTimeout(openWelcome,500)}
}
sb.auth.onAuthStateChange((evt,s)=>{
 if(evt==='PASSWORD_RECOVERY'){try{sessionStorage.setItem('fs-recovery','1')}catch(e){}session=s;history.replaceState(null,'',BASE_URL);me=null;view='newpw';render();return}
 if(evt==='SIGNED_IN'&&recoveryPending()){session=s;if(view!=='newpw'){me=null;view='newpw';render()}return}
 if(evt==='SIGNED_IN'&&(!session||session.user.id!==s.user.id)){session=s;boot();return}
 if(evt==='SIGNED_OUT'){session=null;me=null;if(rtChannel)sb.removeChannel(rtChannel);layer.innerHTML='';authMode='login';view='auth';render();toast('Tu es déconnecté')}
});

// Mise à jour automatique : recharge si une version plus récente est en ligne
(async function autoUpdate(){try{const cur=document.querySelector('meta[name="fs-build"]')?.content;if(!cur)return;const t=await fetch(BASE_URL+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.text());const m=t.match(/name="fs-build" content="(\d+)"/);if(m&&m[1]!==cur&&sessionStorage.getItem('fs-upd')!==m[1]){sessionStorage.setItem('fs-upd',m[1]);location.replace(BASE_URL+'?v='+m[1]+location.hash)}}catch(e){}})();
(function splash(){
 const b=document.createElement('div');b.className='boot';b.setAttribute('role','presentation');
 b.innerHTML=`<div class="boot-in"><div class="logo-wrap" style="--m:url('${LOGO}')"><img src="${LOGO}" alt="Freestyle"><span class="shine"></span></div><div class="load"><i></i></div></div>`;
 document.body.appendChild(b);
 const start=Date.now();
 boot().catch(err=>{console.error(err);toast('Connexion au serveur impossible')}).finally(()=>{setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),650)},Math.max(0,1800-(Date.now()-start)))});
})();
})();
