function openCropper(file,aspect,outW,outH,title){
 return new Promise(resolve=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
   const d=document.createElement('div');d.className='layer crop-wrap';
   d.innerHTML=`<div class="crop"><div class="crop-head"><button type="button" class="crop-txt" data-c="cancel">Annuler</button><b>${esc(title)}</b><button type="button" class="crop-txt strong" data-c="ok">Valider</button></div>
    <div class="crop-stage"><img alt="" draggable="false"><div class="crop-box ${aspect===1?'sq':''}"><i class="cg cg1"></i><i class="cg cg2"></i><i class="cg cg3"></i><i class="cg cg4"></i><span class="ch tl" data-h="tl"></span><span class="ch tr" data-h="tr"></span><span class="ch bl" data-h="bl"></span><span class="ch br" data-h="br"></span></div></div>
    <p class="crop-hint">Déplace le cadre et tire sur un coin pour l’agrandir</p></div>`;
   document.body.appendChild(d);
   const st=d.querySelector('.crop-stage'),im=st.querySelector('img'),bx=st.querySelector('.crop-box');im.src=url;
   const iw=img.naturalWidth,ih=img.naturalHeight;
   const maxW=Math.min(innerWidth-32,460),maxH=Math.min(innerHeight*0.64,600);
   const k=Math.min(maxW/iw,maxH/ih);const dw=Math.round(iw*k),dh=Math.round(ih*k);
   st.style.width=dw+'px';st.style.height=dh+'px';
   const MIN=Math.min(56,dw,dh/ (1/aspect));
   let w=Math.min(dw,dh*aspect)*0.88,h=w/aspect,x=(dw-w)/2,y=(dh-h)/2;
   const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
   const paint=()=>{bx.style.left=x+'px';bx.style.top=y+'px';bx.style.width=w+'px';bx.style.height=h+'px'};paint();
   let mode=null,sx=0,sy=0,o=null;
   bx.addEventListener('pointerdown',e=>{e.preventDefault();bx.setPointerCapture(e.pointerId);mode=e.target.dataset.h||'move';sx=e.clientX;sy=e.clientY;o={x,y,w,h};bx.classList.add('drag')});
   bx.addEventListener('pointermove',e=>{if(!mode)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(mode==='move'){x=cl(o.x+dx,0,dw-o.w);y=cl(o.y+dy,0,dh-o.h)}
    else{const L=mode.includes('l'),T=mode.includes('t');const ax=L?o.x+o.w:o.x,ay=T?o.y+o.h:o.y;
     let nw=Math.max(L?o.w-dx:o.w+dx,(T?o.h-dy:o.h+dy)*aspect);
     const lim=Math.min(L?ax:dw-ax,(T?ay:dh-ay)*aspect);nw=cl(nw,Math.min(MIN,lim),lim);
     w=nw;h=nw/aspect;x=L?ax-w:ax;y=T?ay-h:ay}
    paint()});
   const end=()=>{mode=null;bx.classList.remove('drag')};bx.addEventListener('pointerup',end);bx.addEventListener('pointercancel',end);
   d.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;
    if(b.dataset.c==='cancel'){d.remove();URL.revokeObjectURL(url);resolve(null);return}
    const s=iw/dw,cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
    const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(img,x*s,y*s,w*s,h*s,0,0,outW,outH);
    cv.toBlob(bl=>{d.remove();URL.revokeObjectURL(url);resolve(bl?new File([bl],'crop.jpg',{type:'image/jpeg'}):null)},'image/jpeg',.9);
   });
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Image illisible');resolve(null)};
  img.src=url;
 });
}

// ================= STORIES =================
let sv=null,svT,svRaf,svPaused=false,svImgLeft=0,svImgStart=0,svHeld=false;
const STORY_PHOTO_MS=5000,STORY_VIDEO_MAX=60; // photo : 5 s · vidéo : sa durée réelle, 1 min maximum
function storyUsers(){const ids=Object.keys(storiesBy);return [...ids.filter(i=>i===me.id),...ids.filter(i=>i!==me.id)]}
function openStory(uid){const l=storyUsers();sv={list:l,ui:Math.max(0,l.indexOf(uid)),si:0};showStory()}
function svStopTimers(){clearTimeout(svT);cancelAnimationFrame(svRaf)}
function svStartImg(ms){svImgLeft=ms;svImgStart=Date.now();clearTimeout(svT);svT=setTimeout(nextStory,ms)}
function svPause(){if(!sv||svPaused)return;svPaused=true;clearTimeout(svT);const v=layer.querySelector('.sv video');if(v)v.pause();else svImgLeft=Math.max(0,svImgLeft-(Date.now()-svImgStart));const b=layer.querySelector('.sv-bars span.run i');if(b)b.style.animationPlayState='paused'}
function svResume(){if(!sv||!svPaused||!layer.querySelector('.sv'))return;svPaused=false;const v=layer.querySelector('.sv video');if(v)v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});else svStartImg(Math.max(250,svImgLeft));const b=layer.querySelector('.sv-bars span.run i');if(b)b.style.animationPlayState='running'}
function showStory(){
 svStopTimers();
 const uid=sv.list[sv.ui],items=storiesBy[uid]||[],it=items[sv.si];if(!it)return closeStory();
 if(!seenStories.has(it.id)){seenStories.add(it.id);sb.from('story_views').upsert({story_id:it.id,user_id:me.id},{onConflict:'story_id,user_id',ignoreDuplicates:true}).then(()=>{})}
 const left=Math.max(1,Math.ceil((new Date(it.expires_at)-Date.now())/36e5)),own=uid===me.id;
 layer.innerHTML=`<div class="layer" style="background:#000"><div class="sv" role="dialog" aria-label="Story de ${esc(prof(uid).handle)}">
  <div class="card-media">${mediaHTML(it.media?[it.media]:[],it.sport,'',it.media?'':it.text)}${(it.stickers||[]).map(s=>stkHTML(s)).join('')}</div>
  ${it.media&&it.text?`<div class="grad-cap" style="z-index:4">${esc(it.text)}</div>`:''}
  <div class="sv-bars">${items.map((_,i)=>`<span class="${i<sv.si?'done':i===sv.si?'run':''}"><i></i></span>`).join('')}</div>
  <div class="sv-head">${av(uid,32)}<b>${esc(prof(uid).handle)}${vb(uid)}<small style="display:block;font-size:12px;font-weight:500;opacity:.8">${ago(it.created_at)} · expire dans ${left} h</small></b>${own?`<span class="sv-likes">${I.heart}${myStoryLikes[it.id]||0}</span>`:''}<button class="icon-btn" data-act="story-menu" data-id="${it.id}" aria-label="Options" style="color:#fff;font-weight:900">•••</button><button class="icon-btn" data-act="close-story" aria-label="Fermer" style="color:#fff">${I.close}</button></div>
  <div class="sv-tap"><button data-act="sv-prev" aria-label="Précédent"></button><button data-act="sv-next" aria-label="Suivant"></button></div>
  ${own?`<button class="sv-views" data-act="sv-viewers" data-id="${it.id}" aria-label="Voir qui a vu ta story">${I.views}<span id="svv-n">Vues</span></button>`:`<form class="sv-reply" id="svr"><input id="svi" placeholder="Commenter la story…" aria-label="Commenter la story" maxlength="300"><button type="button" class="sv-like ${likedStories.has(it.id)?'on':''}" data-act="story-like" data-id="${it.id}" aria-label="J’aime la story">${I.heart}</button><button class="send" type="submit" aria-label="Envoyer">${I.send}</button></form>`}
 </div></div>`;
 if(own)sb.from('story_views').select('user_id',{count:'exact',head:true}).eq('story_id',it.id).neq('user_id',me.id).then(({count})=>{const e=$('svv-n');if(e)e.textContent=(count||0)+' vue'+((count||0)>1?'s':'')});
 const f=$('svr');
 if(f){const i=$('svi');i.addEventListener('focus',svPause);i.addEventListener('blur',svResume);f.addEventListener('submit',async e=>{e.preventDefault();if(!i.value.trim())return;if(await sendMsg(uid,'💬 Story : '+i.value)){toast('Commentaire envoyé en message privé');closeStory()}})}
 // appui long = pause (comme Instagram)
 const tap=layer.querySelector('.sv-tap');let ht;
 tap.addEventListener('contextmenu',e=>e.preventDefault());
 tap.addEventListener('pointerdown',()=>{clearTimeout(ht);ht=setTimeout(()=>{svHeld=true;svPause();layer.querySelector('.sv')?.classList.add('held')},220)});
 const up=()=>{clearTimeout(ht);if(svHeld){layer.querySelector('.sv')?.classList.remove('held');svResume();setTimeout(()=>{svHeld=false},60)}};
 ['pointerup','pointercancel','pointerleave'].forEach(t=>tap.addEventListener(t,up));
 // barre de chargement : 5 s par photo, durée réelle de la vidéo (1 min max)
 const v=layer.querySelector('.sv video'),bar=layer.querySelector('.sv-bars span.run i');svPaused=false;svHeld=false;
 if(v){
  v.dataset.w='1';v.loop=false;v.removeAttribute('loop');v.playsInline=true;v.muted=!soundOn;
  if(bar){bar.style.animation='none';bar.style.width='0%'}
  const cap=()=>Math.min(v.duration&&isFinite(v.duration)?v.duration:STORY_VIDEO_MAX,STORY_VIDEO_MAX);
  const tick=()=>{if(!sv||!v.isConnected)return;const d=cap();if(bar)bar.style.width=Math.min(100,(v.currentTime/d)*100)+'%';if(d>0&&v.currentTime>=d-.04){nextStory();return}svRaf=requestAnimationFrame(tick)};
  v.addEventListener('ended',()=>{if(v.isConnected&&sv)nextStory()},{once:true});
  v.addEventListener('error',()=>{if(v.isConnected&&sv){if(bar){bar.style.width='';bar.style.animation=''}svStartImg(STORY_PHOTO_MS)}},{once:true});
  try{v.currentTime=0}catch(e){}
  v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});
  svRaf=requestAnimationFrame(tick);
 }else{if(bar)bar.style.animationDuration=STORY_PHOTO_MS+'ms';svStartImg(STORY_PHOTO_MS)}
}
function nextStory(){if(!sv)return;const n=(storiesBy[sv.list[sv.ui]]||[]).length;if(sv.si<n-1)sv.si++;else if(sv.ui<sv.list.length-1){sv.ui++;sv.si=0}else return closeStory();showStory()}
function prevStory(){if(sv.si>0)sv.si--;else if(sv.ui>0){sv.ui--;sv.si=0}showStory()}
function closeStory(){svStopTimers();sv=null;svPaused=false;layer.innerHTML='';document.querySelector('.svv-wrap')?.remove();if(view==='home')renderHome()}
async function openStoryViewers(sid){
 svPause();
 const d=document.createElement('div');d.className='layer sheet-wrap svv-wrap';
 d.innerHTML=`<div class="sheet" role="dialog" aria-label="Vues de la story"><div class="sheet-head">Vues de ta story</div><div class="sheet-list gutter">${loadingHTML()}</div></div>`;
 document.body.appendChild(d);
 d.addEventListener('click',e=>{if(e.target===d){d.remove();svResume();return}const u=e.target.closest('[data-svu]');if(u){d.remove();closeStory();hist.push([view,arg]);nav('profile',u.dataset.svu)}});
 const [{data:vs},{data:ls}]=await Promise.all([sb.from('story_views').select('user_id,created_at').eq('story_id',sid).neq('user_id',me.id).order('created_at',{ascending:false}).limit(500),sb.from('story_likes').select('user_id').eq('story_id',sid)]);
 const liked=new Set((ls||[]).map(x=>x.user_id)),ids=(vs||[]).map(x=>x.user_id);await loadProfiles(ids);
 const box=d.querySelector('.sheet-list');if(!box)return;
 box.innerHTML=`<div class="svv-sum"><span>${I.views}<b>${ids.length}</b> vue${ids.length>1?'s':''}</span><span class="on">${I.heartSm}<b>${liked.size}</b> j’aime</span></div>`+(ids.length?ids.map(x=>`<button class="conv" data-svu="${x}">${av(x,42)}<span class="meta"><b>${esc(prof(x).handle)}${vb(x)}</b><span>${esc(prof(x).name)}</span></span>${liked.has(x)?`<span class="svv-like on">${I.heartSm}</span>`:''}</button>`).join(''):'<div class="empty">Personne n’a encore vu ta story.</div>');
}

// ================= COMMENTAIRES =================
let cmtLikes={},cmtReply=null,cmtOpen=new Set();
async function loadCmtLikes(pid){const ids=(commentsBy[pid]||[]).map(c=>c.id);for(let i=0;i<ids.length;i+=80){const part=ids.slice(i,i+80);const {data}=await sb.from('comment_likes').select('comment_id,user_id').in('comment_id',part);part.forEach(x=>cmtLikes[x]=new Set());(data||[]).forEach(r=>cmtLikes[r.comment_id]&&cmtLikes[r.comment_id].add(r.user_id))}}
function cmtTree(pid){
 const list=(commentsBy[pid]||[]).filter(c=>!blocked.has(c.user_id)),byId={};list.forEach(c=>byId[c.id]=c);
 const root=c=>{let x=c,n=0;while(x.parent_id&&byId[x.parent_id]&&n++<30)x=byId[x.parent_id];return x};
 const tops=[],kids={};list.forEach(c=>{const r=root(c);if(r===c)tops.push(c);else(kids[r.id]=kids[r.id]||[]).push(c)});
 return {tops,kids,byId};
}
function cmtRow(c,pid,own,reply,byId){
 const lk=cmtLikes[c.id]||new Set(),on=lk.has(me.id),par=reply&&c.parent_id?byId[c.parent_id]:null;
 return `<div class="cmt2 ${reply?'reply':''}" data-cid="${c.id}">${av(c.user_id,reply?26:34)}<div class="c-body"><div class="c-line"><button class="c-who" data-act="open-user" data-u="${c.user_id}">${esc(prof(c.user_id).handle)}${vb(c.user_id)}</button><span class="c-time">${ago(c.created_at)}</span></div><p class="c-text">${par&&par.parent_id?`<span class="c-at">@${esc(prof(par.user_id).handle)}</span> `:''}${esc(c.text)}</p><div class="c-acts"><button data-act="cmt-reply" data-id="${c.id}" data-p="${pid}">Répondre</button>${lk.size?`<span class="c-nl">${lk.size} j’aime</span>`:''}${c.user_id===me.id||own||isAdmin()?`<button data-act="del-cmt" data-id="${c.id}" data-p="${pid}">Supprimer</button>`:''}${c.user_id!==me.id?`<button class="c-rep" data-act="report" data-t="comment" data-id="${c.id}" data-u="${c.user_id}">Signaler</button>`:''}</div></div><button class="c-like ${on?'on':''}" data-act="cmt-like" data-id="${c.id}" data-p="${pid}" aria-label="J’aime le commentaire" aria-pressed="${on}">${I.heartSm}<span>${lk.size||''}</span></button></div>`;
}
function paintComments(pid){
 const box=$('cmt-list');if(!box)return;const p=findPost(pid),own=!!(p&&p.user_id===me.id),{tops,kids,byId}=cmtTree(pid);
 box.innerHTML=tops.length?tops.map(c=>{const k=kids[c.id]||[],open=cmtOpen.has(c.id);return `<div class="c-thread">${cmtRow(c,pid,own,false,byId)}${k.length?`<div class="c-kids">${open?k.map(x=>cmtRow(x,pid,own,true,byId)).join(''):''}<button class="c-more" data-act="cmt-toggle" data-id="${c.id}" data-p="${pid}"><i></i>${open?'Masquer les réponses':(k.length>1?`Voir les ${k.length} réponses`:'Voir la réponse')}</button></div>`:''}</div>`}).join(''):'<div class="empty">Aucun commentaire. Lance la discussion.</div>';
}
function paintReplyBar(){const bar=$('c-replying');if(!bar)return;bar.hidden=!cmtReply;if(cmtReply)bar.querySelector('b').textContent='@'+prof(cmtReply.user_id).handle;const i=$('ci');if(i)i.placeholder=cmtReply?'Ta réponse…':'Ajoute un commentaire…'}
async function openComments(id){
 cmtReply=null;cmtOpen=new Set();
 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet cmt-sheet" role="dialog" aria-label="Commentaires">
  <div class="sheet-head">Commentaires</div>
  <div class="sheet-list gutter" id="cmt-list">${loadingHTML()}</div>
  <form class="composer gutter" id="cf2"><div class="c-replying" id="c-replying" hidden>Réponse à <b></b><button type="button" data-act="cmt-unreply" aria-label="Annuler la réponse">✕</button></div><div class="line">${av(me.id,30)}<input id="ci" maxlength="2000" placeholder="Ajoute un commentaire…" aria-label="Commentaire" autocomplete="off"><button class="send" type="submit" aria-label="Envoyer">${I.send}</button></div></form>
 </div></div>`;
 $('cf2').addEventListener('submit',async e=>{
  e.preventDefault();const i=$('ci'),t=i.value.trim();if(!t)return;const par=cmtReply;i.value='';
  const c=await addComment(id,t,par?par.id:null);if(!c){i.value=t;return}
  cmtLikes[c.id]=new Set();
  if(par){const {kids}=cmtTree(id);const r=Object.keys(kids).find(k=>kids[k].some(x=>x.id===c.id));if(r)cmtOpen.add(r)}
  cmtReply=null;paintReplyBar();paintComments(id);
  const el=document.querySelector(`.cmt2[data-cid="${c.id}"]`);if(el){el.scrollIntoView({block:'nearest'});el.classList.add('fresh')}
 });
 await loadCmtLikes(id);paintComments(id);
}
async function toggleCmtLike(cid,btn){
 const s=cmtLikes[cid]=cmtLikes[cid]||new Set(),was=s.has(me.id);was?s.delete(me.id):s.add(me.id);
 const paint=()=>{document.querySelectorAll(`.c-like[data-id="${cid}"]`).forEach(b=>{b.classList.toggle('on',s.has(me.id));b.setAttribute('aria-pressed',s.has(me.id));b.querySelector('span').textContent=s.size||''});const row=document.querySelector(`.cmt2[data-cid="${cid}"] .c-acts`);if(row){row.querySelector('.c-nl')?.remove();if(s.size)row.querySelector('button').insertAdjacentHTML('afterend',`<span class="c-nl">${s.size} j’aime</span>`)}};
 paint();if(!was&&btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}
 const {error}=was?await sb.from('comment_likes').delete().eq('comment_id',cid).eq('user_id',me.id):await sb.from('comment_likes').insert({comment_id:cid,user_id:me.id});
 if(error&&!/duplicate/.test(error.message||'')){was?s.add(me.id):s.delete(me.id);paint();dbError(error,'Action impossible')}
}

 const act=a.dataset.act,u=a.dataset.u,id=a.dataset.id;
 switch(act){

   const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:BASE_URL});authErr='';authInfo=error?'Envoi impossible pour le moment, réessaie plus tard.':'Si un compte existe pour '+em+', un lien pour changer ton mot de passe a été envoyé.';renderAuth({e:em});break}

const SHOP_URL='https://freestyle-calisthenics.fr/';
const SHOP_LOGO='https://cdn.shopify.com/oxygen-v2/62941/180579/369192/4773702/assets/logo-freestyle-Dng_PzUd.webp';
const SHOP_ALL='https://freestyle-calisthenics.fr/collections/all';
let shopRaf=0,shopFit=null;
function renderShop(){
 topEl.innerHTML='';
 const layers=[6,5,4,3,2,1].map(i=>`<img class="s3-layer" src="${SHOP_LOGO}" alt="" aria-hidden="true" draggable="false" style="--z:${-i*1.7}px;--b:${(.14+.06*(6-i)).toFixed(2)}">`).join('');
 main.innerHTML=`<div class="shop3d" id="shop3d">
  <canvas class="s3-dust" id="s3-dust" aria-hidden="true"></canvas>
  <span class="s3-beam" aria-hidden="true"></span>
  <i class="s3-c tl" aria-hidden="true"></i><i class="s3-c tr" aria-hidden="true"></i><i class="s3-c bl" aria-hidden="true"></i><i class="s3-c br" aria-hidden="true"></i>
  <span class="s3-side l" aria-hidden="true">FREESTYLE</span><span class="s3-side r" aria-hidden="true">CALISTHENICS</span>
  <div class="s3-stage"><div class="s3-obj" id="s3-obj"><span class="s3-halo" aria-hidden="true"></span>${layers}<img class="s3-front" src="${SHOP_LOGO}" alt="FREESTYLE Calisthenics" draggable="false"></div><span class="s3-floor" aria-hidden="true"></span></div>
  <a class="s3-btn" href="${SHOP_URL}" target="_blank" rel="noopener noreferrer">Boutique<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
 </div>`;
 // logo de secours si celui du site ne charge pas
 const front=main.querySelector('.s3-front');front.addEventListener('error',()=>{main.querySelectorAll('.s3-obj img').forEach(im=>{im.src=LOGO});main.querySelector('.s3-obj').classList.add('fb')},{once:true});
 // poussière lumineuse
 const box=$('shop3d'),obj=$('s3-obj'),cv=$('s3-dust'),cx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);let W=0,H=0;
 shopFit=()=>{if(!cv.isConnected)return;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};shopFit();
 const dust=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.3,v:Math.random()*.00022+.00006,a:Math.random()*.45+.12,dash:Math.random()<.16,tw:Math.random()*6.28}));
 // effet 3D : le logo se balance doucement et suit le doigt ou la souris
 let tx=0,ty=0,cx2=0,cy2=0;const t0=performance.now(),still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 box.addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5});
 box.addEventListener('pointerleave',()=>{tx=0;ty=0});
 const loop=t=>{
  if(view!=='shop'||!obj.isConnected)return;
  const k=(t-t0)/1000;cx2+=(tx-cx2)*.06;cy2+=(ty-cy2)*.06;
  const ry=still?0:Math.sin(k*.55)*16+cx2*34,rx=still?0:Math.sin(k*.42)*5-cy2*22;
  obj.style.transform=`translateY(${still?0:Math.sin(k*.9)*5}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  cx.clearRect(0,0,W,H);
  for(const p of dust){if(!still){p.y-=p.v*16;if(p.y<-.02){p.y=1.02;p.x=Math.random()}}const al=p.a*(.65+.35*Math.sin(k*1.4+p.tw));cx.fillStyle=`rgba(255,255,255,${al.toFixed(3)})`;const x=p.x*W,y=p.y*H;if(p.dash)cx.fillRect(x,y,7,1);else{cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill()}}
  shopRaf=requestAnimationFrame(loop);
 };
 cancelAnimationFrame(shopRaf);shopRaf=requestAnimationFrame(loop);
}

  <div class="ann-top"><span class="ann-chip">${I[k[1]]}${k[0]}</span><time>${ago(a.created_at)}</time>${isAdmin()?`<button class="ann-more" data-act="ann-menu" data-id="${a.id}" aria-label="Options de l’annonce">•••</button>`:''}</div>
  <div class="ann-main">${d?`<div class="ann-date"><b>${d.getDate()}</b><span>${d.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</span><small>${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div>`:''}<div class="ann-txt"><h3>${esc(a.title)}</h3>${a.body?`<p>${esc(a.body)}</p>`:''}</div></div>
  ${d||a.place?`<div class="ann-meta">${d?`<span>${I.cal}${esc(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>`:''}${a.place?`<span>${I.pin}${esc(a.place)}</span>`:''}</div>`:''}
  <div class="ann-by">${av(a.author_id,22)}<b>${esc(prof(a.author_id).handle)}${vb(a.author_id)}</b><span>· équipe Freestyle</span></div>
 </article>`;
}
function renderInfos(){
 topEl.innerHTML=`<button class="icon-btn" data-act="back" aria-label="Retour">${I.back}</button><h1 class="ptitle">Messages</h1><span class="icon-btn"></span>`;
 main.innerHTML=`<div class="gutter">${mtabsHTML()}<div class="ann-list">${isAdmin()?`<button class="ann-new" data-act="ann-new">${I.plus}<span><b>Publier une annonce</b><small>Événement, rassemblement ou info visible par tout le monde</small></span></button>`:''}${!annLoaded?loadingHTML():annList.length?annList.map(annHTML).join(''):`<div class="empty ann-empty">${I.info}<b>Aucune annonce pour l’instant</b><span>Les événements, rassemblements et infos de Freestyle apparaîtront ici.</span></div>`}</div></div>`;
 if(!annLoaded)loadAnnouncements().then(()=>{if(view==='messages'&&msgTab==='info')renderInfos()});else markInfoSeen();
}
function openAnnForm(){
 if(!isAdmin())return;let kind='event';
 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet ann-sheet" role="dialog" aria-label="Nouvelle annonce"><div class="sheet-head">Nouvelle annonce</div>
  <form class="gutter ann-form" id="anf" novalidate>
   <div class="seg ann-seg" role="group" aria-label="Type d’annonce">${Object.entries(ANN_KINDS).map(([k,[l]])=>`<button type="button" data-ak="${k}" aria-pressed="${k===kind}">${l}</button>`).join('')}</div>
   <label class="ep-f"><span>Titre</span><input id="an-t" maxlength="80" placeholder="Ex. Rassemblement street workout à Albi"></label>
   <label class="ep-f"><span>Texte <em>facultatif</em></span><textarea id="an-b" maxlength="1500" rows="4" placeholder="Programme, infos pratiques…"></textarea></label>
   <div class="ann-row2"><label class="ep-f"><span>Date et heure <em>facultatif</em></span><input id="an-d" type="datetime-local"></label><label class="ep-f"><span>Lieu <em>facultatif</em></span><input id="an-p" maxlength="120" placeholder="Ville, parc, salle…"></label></div>
   <p class="err" id="an-err"></p>
   <button class="ep-save" type="submit" id="an-go">Publier pour tout le monde</button>
  </form></div></div>`;
 layer.querySelectorAll('[data-ak]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.ak;layer.querySelectorAll('[data-ak]').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
 $('anf').addEventListener('submit',async e=>{
  e.preventDefault();const title=$('an-t').value.trim(),body=$('an-b').value.trim(),dv=$('an-d').value,place=$('an-p').value.trim();
  if(!title){$('an-err').textContent='Donne un titre à ton annonce';return}
  if(!(await guard([title,body,place].join(' \n '))))return;
  const b=$('an-go');b.disabled=true;b.textContent='Publication…';
  const {data,error}=await sb.from('announcements').insert({author_id:me.id,kind,title,body,event_at:dv?new Date(dv).toISOString():null,place:place||null}).select().single();
  if(error){b.disabled=false;b.textContent='Publier pour tout le monde';return dbError(error,'Publication impossible')}
  if(!annList.some(x=>x.id===data.id))annList.unshift(data);annLoaded=true;markInfoSeen();layer.innerHTML='';toast('Annonce publiée : tout le monde est prévenu');if(view==='messages')renderMessages(curQuery);
 });
}
async function deleteAnn(id){const {error}=await sb.from('announcements').delete().eq('id',id);if(error)return dbError(error,'Suppression impossible');annList=annList.filter(a=>a.id!==id);toast('Annonce supprimée');if(view==='messages')renderMessages(curQuery)}

// ================= VUES =================
const viewQ=new Set(),viewSeen={};let viewTimer;
const viewObs='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{const el=e.target;if(!el.isConnected){viewObs.unobserve(el);return}if(e.isIntersecting&&e.intersectionRatio>=.6){clearTimeout(el._vt);el._vt=setTimeout(()=>{if(el.isConnected)queueView(el.dataset.dbl)},1000)}else clearTimeout(el._vt)}),{threshold:[0,.6]}):null;
function wireViews(root){if(!viewObs)return;root.querySelectorAll('[data-dbl]:not([data-vo])').forEach(el=>{el.dataset.vo='1';viewObs.observe(el)})}
function queueView(id){if(!id||!me)return;const p=findPost(id);if(!p||p.user_id===me.id)return;if(viewSeen[id]&&Date.now()-viewSeen[id]<60000)return;viewSeen[id]=Date.now();viewQ.add(id);clearTimeout(viewTimer);viewTimer=setTimeout(flushViews,2500)}
async function flushViews(){if(!viewQ.size)return;const ids=[...viewQ];viewQ.clear();try{await sb.rpc('fs_view_posts',{ids})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushViews()});

// ================= STATISTIQUES =================
const pct=(a,b)=>b?Math.round(a/b*100):0;
function statThumb(p){const m=(p.media||[])[0];return m?(m.type==='video'?`<video src="${esc(m.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(m.url)}" alt="">`):''}
async function openPostStats(id){
 const p=findPost(id);
 layer.innerHTML=`<div class="layer sheet-wrap" data-act="close-sheet"><div class="sheet stats-sheet" role="dialog" aria-label="Statistiques"><div class="sheet-head">Statistiques</div><div class="sheet-list gutter" id="pst">${loadingHTML()}</div></div></div>`;
 const {data:s,error}=await sb.rpc('fs_post_stats',{pid:id});const box=$('pst');if(!box)return;
 if(error||!s){box.innerHTML='<div class="empty">Statistiques indisponibles.</div>';return}
 const inter=s.likes+s.comments+s.shares+s.reactions,fol=pct(s.reach_followers,s.reach);
 box.innerHTML=`<div class="st-head">${p?`<span class="st-th">${statThumb(p)}</span>`:''}<span><b>${p&&p.kind==='clip'?'Clip':'Publication'}</b><small>Publiée le ${new Date(s.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</small></span></div>
  <div class="st-icons"><span>${I.heartSm}<b>${fmt(s.likes)}</b></span><span>${I.cmtSm}<b>${fmt(s.comments)}</b></span><span>${I.shareSm}<b>${fmt(s.shares)}</b></span><span>${I.reactSm}<b>${fmt(s.reactions)}</b></span></div>
  <div class="st-sec"><h4>Vues</h4><div class="st-big"><b>${fmt(s.views)}</b><span>vue${s.views>1?'s':''}</span></div>
   <div class="st-split"><i style="width:${fol}%"></i></div><div class="st-leg"><span><i class="a"></i>Abonnés ${fol} %</span><span><i class="b"></i>Non-abonnés ${s.reach?100-fol:0} %</span></div>
   <div class="st-row"><span>Comptes touchés</span><b>${fmt(s.reach)}</b></div></div>
  <div class="st-sec"><h4>Interactions</h4><div class="st-row"><span>J’aime</span><b>${fmt(s.likes)}</b></div><div class="st-row"><span>Commentaires</span><b>${fmt(s.comments)}</b></div><div class="st-row"><span>Partages</span><b>${fmt(s.shares)}</b></div><div class="st-row"><span>Réactions stickers</span><b>${fmt(s.reactions)}</b></div><div class="st-row tot"><span>Total</span><b>${fmt(inter)}</b></div></div>
  <div class="st-sec"><h4>Activité du profil</h4><div class="st-row"><span>Visites du profil</span><b>${fmt(s.profile_visits)}</b></div><div class="st-row"><span>Nouveaux abonnés</span><b>${fmt(s.follows)}</b></div></div>
  <p class="st-note">Les vues comptent chaque affichage à l’écran. Les comptes touchés sont les personnes différentes qui ont vu la publication.</p>`;
 box.querySelectorAll('video').forEach(v=>{v.dataset.w='1';v.pause()});
}
let insDays=30;
async function renderInsights(){
 topEl.innerHTML=`<button class="icon-btn" data-act="back" aria-label="Retour">${I.back}</button><h1 class="ptitle">Tableau de bord</h1><span class="icon-btn"></span>`;
 const chips=`<div class="ins-chips">${[7,30,90].map(d=>`<button data-act="ins-days" data-k="${d}" aria-pressed="${d===insDays}">${d} jours</button>`).join('')}</div>`;
 main.innerHTML=`<div class="gutter ins">${chips}${loadingHTML()}</div>`;
 const days=insDays;const {data:s,error}=await sb.rpc('fs_account_stats',{days});
 if(view!=='insights'||days!==insDays)return;
 if(error||!s){main.innerHTML=`<div class="gutter ins">${chips}<div class="empty">Statistiques indisponibles pour le moment.</div></div>`;return}
 const delta=s.reach_prev?Math.round((s.reach-s.reach_prev)/s.reach_prev*100):null,fol=pct(s.reach_followers,s.reach),mx=Math.max(1,...s.daily.map(x=>x.v));
 const dd=x=>new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
 main.innerHTML=`<div class="gutter ins">${chips}
  <div class="ins-grid">
   <div class="ins-card big"><span>Vues</span><b>${fmt(s.views)}</b><small>sur tes publications et clips</small></div>
   <div class="ins-card"><span>Comptes touchés</span><b>${fmt(s.reach)}</b>${delta!==null?`<small class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta} % vs période précédente</small>`:'<small>personnes différentes</small>'}</div>
   <div class="ins-card"><span>Interactions</span><b>${fmt(s.interactions)}</b><small>${fmt(s.likes)} j’aime · ${fmt(s.comments)} comm.</small></div>
   <div class="ins-card"><span>Abonnés</span><b>${fmt(s.followers)}</b><small class="${s.new_followers?'up':''}">+${fmt(s.new_followers)} sur la période</small></div>
   <div class="ins-card"><span>Visites du profil</span><b>${fmt(s.profile_visits)}</b><small>${fmt(s.shares)} partage${s.shares>1?'s':''}</small></div>
  </div>
  <div class="st-sec"><h4>Nouveaux comptes touchés par jour</h4><div class="ins-chart" role="img" aria-label="Comptes touchés par jour">${s.daily.map(x=>`<i style="height:${Math.max(3,x.v/mx*100)}%" title="${dd(x.d)} : ${x.v}"></i>`).join('')}</div><div class="ins-axis"><span>${s.daily.length?dd(s.daily[0].d):''}</span><span>Aujourd’hui</span></div></div>
  <div class="st-sec"><h4>Audience touchée</h4><div class="st-split"><i style="width:${fol}%"></i></div><div class="st-leg"><span><i class="a"></i>Abonnés ${fol} %</span><span><i class="b"></i>Non-abonnés ${s.reach?100-fol:0} %</span></div></div>
  <div class="st-sec"><h4>Meilleurs contenus</h4>${s.top.length?`<div class="grid ins-top">${s.top.map(p=>`<button data-act="post-stats" data-id="${p.id}" aria-label="Statistiques de ce contenu">${mediaHTML(p.media&&p.media.length?[p.media[0]]:[],p.sport)}<span class="g-views">${I.playV}${fmt(p.views)}</span></button>`).join('')}</div>`:'<div class="empty">Publie pendant cette période pour voir tes meilleurs contenus.</div>'}</div>
 </div>`;
 main.querySelectorAll('.grid video').forEach(v=>{v.dataset.w='1';v.muted=true;v.removeAttribute('autoplay');v.pause()});
}

// ================= DÉMARRAGE =================
async function refreshHome(){await Promise.all([loadFeed(),loadStories(),loadFollowing()])}
let booted=false;
async function boot(){
 const {data:{session:s}}=await sb.auth.getSession();session=s;
 if(!session){me=null;view='auth';render();return}
 if(await checkMyBan())return;
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(error){console.error(error);toast('Connexion au serveur impossible');}
 if(!p||!p.onboarded){me=null;obExisting=p||null;if(p&&!ob.name)ob.name='';view='onboard';render();return}
 me=p;P[me.id]=p;paintNavAv();
 main.innerHTML=loadingHTML('Chargement du fil…');
 await Promise.all([refreshHome(),loadConvs(),loadNotifs(),loadClips(),loadAdmins(),loadBlocks(),loadGroups(),loadAnnouncements(),loadNotifPrefs()]);recountUnread();loadBans();
 subscribeRealtime();
 const qpost=new URLSearchParams(location.search).get('p');if(qpost){history.replaceState(null,'',BASE_URL);const {data:pp}=await sb.from('feed').select('*').eq('id',qpost).maybeSingle();if(pp){await loadProfiles([pp.user_id]);if(pp.kind==='clip'){clipsList=[pp,...clipsList.filter(x=>x.id!==pp.id)];view='clips';arg=pp.id}else{feed=[pp,...feed.filter(x=>x.id!==pp.id)];await loadComments(feed.map(x=>x.id));view='home';setTimeout(()=>document.querySelector(`.card[data-id="${pp.id}"]`)?.scrollIntoView({block:'start'}),80)}}else toast('Cette publication n’existe plus')}
 const qu=new URLSearchParams(location.search).get('u');if(qu){history.replaceState(null,'',BASE_URL);const {data:tp}=await sb.from('profiles').select('id,handle,name,sport,bio,city,avatar_url,banner_url,prs').eq('handle',qu.toLowerCase()).maybeSingle();if(tp){P[tp.id]=tp;view='profile';arg=tp.id}}
 cleanExpiredStories();
 if(!['home','clips','messages','profile','create','shop'].includes(view))view='home';
 render();
}
sb.auth.onAuthStateChange((evt,s)=>{
 if(evt==='PASSWORD_RECOVERY'){session=s;view='newpw';render();return}
 if(evt==='SIGNED_IN'&&(!session||session.user.id!==s.user.id)){session=s;boot();return}
 if(evt==='SIGNED_OUT'){session=null;me=null;if(rtChannel)sb.removeChannel(rtChannel);layer.innerHTML='';authMode='login';view='auth';render();toast('Tu es déconnecté')}
});

// Mise à jour automatique : recharge si une version plus récente est en ligne
(async function autoUpdate(){try{const cur=document.querySelector('meta[name="fs-build"]')?.content;if(!cur)return;const t=await fetch(BASE_URL+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.text());const m=t.match(/name="fs-build" content="(\d+)"/);if(m&&m[1]!==cur&&sessionStorage.getItem('fs-upd')!==m[1]){sessionStorage.setItem('fs-upd',m[1]);location.replace(BASE_URL+'?v='+m[1]+location.hash)}}catch(e){}})();
(function splash(){
 const b=document.createElement('div');b.className='boot';b.setAttribute('role','presentation');
 b.innerHTML=`<div class="boot-in"><div class="logo-wrap" style="--m:url('${LOGO}')"><img src="${LOGO}" alt="Freestyle"><span class="shine"></span></div><div class="load"><i></i></div></div>`;
 document.body.appendChild(b);
 const start=Date.now();
 boot().catch(err=>{console.error(err);toast('Connexion au serveur impossible')}).finally(()=>{setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),650)},Math.max(0,1800-(Date.now()-start)))});
})();
})();
